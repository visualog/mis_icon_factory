<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IconFactory Webfont Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style id="generatedFontStyle"></style>
    <style>
        :root {
            --bg: #f6f3ee;
            --bg-accent: #ebe4d8;
            --surface: rgba(255, 255, 255, 0.88);
            --surface-strong: #ffffff;
            --text: #1e1f24;
            --text-subtle: #6d6e76;
            --line: rgba(30, 31, 36, 0.08);
            --line-strong: rgba(30, 31, 36, 0.18);
            --shadow: 0 18px 40px rgba(45, 37, 24, 0.08);
            --accent: #1f6fff;
            --accent-soft: rgba(31, 111, 255, 0.12);
            --success: #0f8b6d;
            --success-soft: rgba(15, 139, 109, 0.12);
            --danger: #e64c3c;
            --controller-height: 116px;
            --preview-color: #1e1f24;
            --preview-size: 24px;
            --preview-weight: 400;
            --font-main: 'Manrope', sans-serif;
            --font-mono: 'IBM Plex Mono', monospace;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
        }

        body {
            font-family: var(--font-main);
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(255, 255, 255, 0.95) 0, rgba(255, 255, 255, 0) 32%),
                radial-gradient(circle at top right, rgba(235, 228, 216, 0.92) 0, rgba(235, 228, 216, 0) 35%),
                linear-gradient(180deg, #fbfaf8 0%, var(--bg) 50%, #f1eee8 100%);
            overflow: hidden;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .app-shell {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            flex: 0 0 auto;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 16px;
            padding: 18px 24px 8px;
        }

        .topbar-controls {
            display: flex;
            align-items: center;
            flex: 1 1 auto;
            min-width: 0;
        }

        .search-combo {
            position: relative;
            width: 100%;
        }

        .search-combo-shell {
            min-height: 48px;
            display: flex;
            align-items: center;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.74);
            box-shadow: 0 10px 24px rgba(48, 41, 29, 0.04);
            overflow: hidden;
        }

        .search-combo:focus-within .search-combo-shell {
            outline: 3px solid rgba(31, 111, 255, 0.35);
            outline-offset: 3px;
        }

        .dropdown {
            position: relative;
        }

        .dropdown-trigger {
            min-height: 48px;
            padding: 0 16px 0 18px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.74);
            box-shadow: 0 10px 24px rgba(48, 41, 29, 0.04);
            color: var(--text);
            display: inline-flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: -0.02em;
            text-align: left;
        }

        .dropdown-trigger-icon {
            font-size: 20px;
            line-height: 1;
            pointer-events: none;
            color: rgba(30, 31, 36, 0.78);
            flex: 0 0 auto;
        }

        .dropdown.open .dropdown-trigger {
            border-color: var(--line-strong);
            box-shadow: 0 14px 32px rgba(48, 41, 29, 0.08);
        }

        .dropdown-menu {
            position: absolute;
            min-width: 220px;
            padding: 8px;
            border-radius: 20px;
            border: 1px solid rgba(30, 31, 36, 0.08);
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(16px);
            box-shadow: 0 18px 40px rgba(48, 41, 29, 0.14);
            display: none;
            flex-direction: column;
            gap: 4px;
            z-index: 30;
        }

        .dropdown.open .dropdown-menu {
            display: flex;
        }

        .dropdown--down .dropdown-menu {
            top: calc(100% + 10px);
            left: 0;
            transform-origin: top left;
        }

        .dropdown--up .dropdown-menu {
            bottom: calc(100% + 10px);
            right: 0;
            transform-origin: bottom right;
        }

        .dropdown-option {
            min-height: 42px;
            padding: 0 14px;
            border: 0;
            border-radius: 14px;
            background: transparent;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: -0.02em;
            text-align: left;
        }

        .dropdown-option:hover {
            background: rgba(30, 31, 36, 0.05);
        }

        .dropdown-option.active {
            background: rgba(31, 111, 255, 0.1);
            color: var(--accent);
        }

        .dropdown-option.active::after {
            content: '';
            width: 6px;
            height: 10px;
            border-right: 2px solid currentColor;
            border-bottom: 2px solid currentColor;
            transform: rotate(45deg);
        }

        .category-trigger {
            min-width: 156px;
            flex: 0 0 156px;
            padding-right: 14px;
        }

        .category-menu {
            min-width: 220px;
            left: 0;
            right: auto;
            transform-origin: bottom left;
        }

        .category-option {
            min-height: 42px;
        }

        .upload-button {
            min-height: 48px;
            padding: 0 18px;
            border-radius: 999px;
            border: 1px solid rgba(30, 31, 36, 0.08);
            background: rgba(255, 255, 255, 0.78);
            box-shadow: 0 8px 24px rgba(48, 41, 29, 0.08);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--text);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .upload-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 28px rgba(48, 41, 29, 0.12);
        }

        .upload-button:disabled {
            cursor: progress;
            transform: none;
            box-shadow: 0 8px 24px rgba(48, 41, 29, 0.08);
            opacity: 0.72;
        }

        .upload-button::before {
            content: '+';
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--text);
            color: #fff;
            font-size: 18px;
            line-height: 1;
        }

        .content-scroll {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 0 24px calc(var(--controller-height) + 48px);
        }

        .library-shell {
            max-width: 1400px;
            margin: 0 auto;
            padding-bottom: 40px;
        }

        .library-hero {
            padding: 4px 0 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .hero-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-start;
        }

        .meta-pill {
            min-height: 38px;
            padding: 0 14px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.72);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-subtle);
        }

        .meta-pill.success {
            border-color: rgba(15, 139, 109, 0.12);
            color: var(--success);
            background: var(--success-soft);
        }

        .drag-overlay {
            position: fixed;
            inset: 0;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(246, 243, 238, 0.72);
            backdrop-filter: blur(10px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s ease;
            z-index: 50;
        }

        .drag-overlay.visible {
            opacity: 1;
            pointer-events: none;
        }

        .drag-overlay.is-build {
            background: rgba(246, 243, 238, 0.2);
            backdrop-filter: blur(4px);
        }

        .drag-overlay-card {
            position: fixed;
            left: 8px;
            top: 8px;
            width: calc(100vw - 16px);
            height: calc(100vh - 16px);
            border-radius: 32px;
            border: 2px dashed rgba(31, 111, 255, 0.42);
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 0.84)),
                linear-gradient(135deg, rgba(31, 111, 255, 0.1), rgba(15, 139, 109, 0.06));
            box-shadow: 0 24px 48px rgba(31, 111, 255, 0.12);
            padding: 28px 32px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 14px;
            text-align: center;
            overflow: hidden;
            transition:
                left 0.56s cubic-bezier(0.22, 1, 0.36, 1),
                top 0.56s cubic-bezier(0.22, 1, 0.36, 1),
                width 0.56s cubic-bezier(0.22, 1, 0.36, 1),
                height 0.56s cubic-bezier(0.22, 1, 0.36, 1),
                border-radius 0.56s cubic-bezier(0.22, 1, 0.36, 1),
                padding 0.56s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.56s cubic-bezier(0.22, 1, 0.36, 1),
                background 0.3s ease,
                border-color 0.3s ease,
                opacity 0.18s ease;
        }

        .drag-overlay-card.is-build {
            left: var(--build-left, 24px);
            top: var(--build-top, 24px);
            width: var(--build-width, 180px);
            height: var(--build-height, 210px);
            border-radius: 24px;
            border-style: solid;
            border-color: rgba(31, 111, 255, 0.18);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(255, 255, 255, 0.9)),
                linear-gradient(135deg, rgba(31, 111, 255, 0.08), rgba(15, 139, 109, 0.04));
            box-shadow: 0 18px 34px rgba(48, 41, 29, 0.12);
            padding: 18px;
            justify-content: flex-start;
            gap: 10px;
            text-align: left;
        }

        .drag-overlay-card.is-success {
            border-color: rgba(15, 139, 109, 0.2);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(247, 255, 252, 0.92)),
                linear-gradient(135deg, rgba(15, 139, 109, 0.08), rgba(31, 111, 255, 0.04));
        }

        .drag-overlay.is-build .drag-overlay-card {
            opacity: 0;
            transform: scale(0.98);
        }

        .drag-overlay-kicker {
            font-family: var(--font-mono);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            color: var(--accent);
        }

        .drag-overlay-card.is-build .drag-overlay-kicker {
            font-size: 10px;
            letter-spacing: 0.01em;
        }

        .drag-overlay-card.is-success .drag-overlay-kicker {
            color: var(--success);
        }

        .drag-overlay-title {
            font-size: clamp(28px, 4vw, 44px);
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.08;
            word-break: keep-all;
        }

        .drag-overlay-card.is-build .drag-overlay-title {
            font-size: 18px;
            line-height: 1.18;
            letter-spacing: -0.02em;
            max-width: 10ch;
        }

        .drag-overlay-desc {
            margin: 0 auto;
            max-width: 42ch;
            color: var(--text-subtle);
            line-height: 1.7;
            letter-spacing: -0.01em;
            font-size: 15px;
            word-break: keep-all;
        }

        .drag-overlay-card.is-build .drag-overlay-desc {
            margin: 0;
            max-width: none;
            font-size: 12px;
            line-height: 1.5;
            letter-spacing: -0.01em;
        }

        .drag-overlay-progress {
            width: 100%;
            height: 7px;
            border-radius: 999px;
            background: rgba(30, 31, 36, 0.08);
            overflow: hidden;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            margin-top: auto;
        }

        .drag-overlay-card.is-build .drag-overlay-progress {
            opacity: 1;
            transform: translateY(0);
        }

        .drag-overlay-progress-bar {
            width: 42%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, rgba(31, 111, 255, 0.18), rgba(31, 111, 255, 0.72), rgba(15, 139, 109, 0.5));
            animation: drag-overlay-progress 1.1s ease-in-out infinite;
        }

        .drag-overlay-card.is-success .drag-overlay-progress-bar {
            animation: none;
            width: 100%;
            background: linear-gradient(90deg, rgba(15, 139, 109, 0.45), rgba(15, 139, 109, 0.9));
        }

        @keyframes drag-overlay-progress {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(240%);
            }
        }

        .drag-overlay-build-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .drag-overlay-build-card {
            position: fixed;
            left: 8px;
            top: 8px;
            width: calc(100vw - 16px);
            height: calc(100vh - 16px);
            border-radius: 32px;
            border: 2px solid rgba(31, 111, 255, 0.18);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(255, 255, 255, 0.9)),
                linear-gradient(135deg, rgba(31, 111, 255, 0.08), rgba(15, 139, 109, 0.04));
            box-shadow: 0 18px 34px rgba(48, 41, 29, 0.12);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: flex-start;
            overflow: hidden;
            opacity: 0;
            transition:
                left 0.56s cubic-bezier(0.22, 1, 0.36, 1),
                top 0.56s cubic-bezier(0.22, 1, 0.36, 1),
                width 0.56s cubic-bezier(0.22, 1, 0.36, 1),
                height 0.56s cubic-bezier(0.22, 1, 0.36, 1),
                border-radius 0.56s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.18s ease,
                transform 0.56s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.3s ease,
                border-color 0.3s ease,
                background 0.3s ease;
            transition-delay: var(--card-delay, 0ms);
            transform: scale(1);
        }

        .drag-overlay.is-build .drag-overlay-build-card {
            left: var(--card-left, 24px);
            top: var(--card-top, 24px);
            width: var(--card-width, 180px);
            height: var(--card-height, 210px);
            border-radius: 24px;
            opacity: 1;
        }

        .drag-overlay.is-success .drag-overlay-build-card {
            border-color: rgba(15, 139, 109, 0.2);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(247, 255, 252, 0.92)),
                linear-gradient(135deg, rgba(15, 139, 109, 0.08), rgba(31, 111, 255, 0.04));
        }

        .drag-overlay-build-kicker {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.01em;
            color: var(--accent);
        }

        .drag-overlay.is-success .drag-overlay-build-kicker {
            color: var(--success);
        }

        .drag-overlay-build-name {
            font-size: 18px;
            font-weight: 800;
            line-height: 1.18;
            letter-spacing: -0.02em;
            color: var(--text);
            word-break: keep-all;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .drag-overlay-build-desc {
            margin: 0;
            font-size: 12px;
            line-height: 1.5;
            letter-spacing: -0.01em;
            color: var(--text-subtle);
            word-break: keep-all;
        }

        .drag-overlay-build-progress {
            width: 100%;
            height: 7px;
            margin-top: auto;
            border-radius: 999px;
            background: rgba(30, 31, 36, 0.08);
            overflow: hidden;
        }

        .drag-overlay-build-progress-bar {
            width: 42%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, rgba(31, 111, 255, 0.18), rgba(31, 111, 255, 0.72), rgba(15, 139, 109, 0.5));
            animation: drag-overlay-progress 1.1s ease-in-out infinite;
        }

        .drag-overlay.is-success .drag-overlay-build-progress-bar {
            animation: none;
            width: 100%;
            background: linear-gradient(90deg, rgba(15, 139, 109, 0.45), rgba(15, 139, 109, 0.9));
        }

        .filters {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-field,
        .filter-select {
            min-height: 46px;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.74);
            padding: 0 14px;
            color: var(--text);
            box-shadow: 0 10px 24px rgba(48, 41, 29, 0.04);
        }

        .search-field {
            min-width: 240px;
            flex: 1 1 240px;
        }

        .filter-select {
            min-width: 180px;
        }

        .search-combo .search-field {
            min-height: 48px;
            border: 0;
            box-shadow: none;
            background: transparent;
            border-radius: 0;
        }

        .search-combo .search-field {
            min-width: 0;
            flex: 1 1 auto;
        }

        .search-combo .search-field:focus-visible,
        .dropdown-option:focus-visible,
        .dropdown-trigger:focus-visible {
            outline: none;
        }

        .library-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 16px;
        }

        .icon-card,
        .empty-card {
            border-radius: 24px;
            border: 1px solid rgba(30, 31, 36, 0.06);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 0.74));
            box-shadow: 0 12px 30px rgba(48, 41, 29, 0.05);
            min-height: 210px;
        }

        .icon-card {
            padding: 18px 18px 14px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        .icon-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 18px 34px rgba(48, 41, 29, 0.1);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .kind-pill {
            min-height: 28px;
            padding: 0 10px;
            border-radius: 999px;
            background: rgba(30, 31, 36, 0.06);
            color: var(--text-subtle);
            font-family: var(--font-mono);
            font-size: 11px;
            display: inline-flex;
            align-items: center;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .kind-pill.fill {
            background: rgba(31, 111, 255, 0.12);
            color: var(--accent);
        }

        .card-icon-wrap {
            flex: 1 1 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 0;
        }

        .library-icon {
            font-size: var(--preview-size);
            font-weight: var(--preview-weight);
            color: var(--preview-color);
            transition: color 0.18s ease, font-size 0.18s ease, font-weight 0.18s ease;
        }

        .card-label {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .card-subtitle {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-subtle);
        }

        .card-devtools {
            position: absolute;
            left: 14px;
            right: 14px;
            bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 14px;
            background: rgba(30, 31, 36, 0.94);
            color: #fff;
            opacity: 0;
            transform: translateY(6px);
            pointer-events: none;
            transition: opacity 0.18s ease, transform 0.18s ease;
        }

        .icon-card:hover .card-devtools,
        .icon-card:focus-within .card-devtools {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .card-devtools-key {
            min-width: 0;
            font-family: var(--font-mono);
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-copy-button {
            flex: 0 0 auto;
            min-height: 28px;
            padding: 0 10px;
            border: 0;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
            font-family: var(--font-mono);
            font-size: 11px;
        }

        .card-copy-button:hover {
            background: rgba(255, 255, 255, 0.22);
        }

        .empty-card {
            grid-column: 1 / -1;
            padding: 40px 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .empty-card.error-state {
            border-color: rgba(230, 76, 60, 0.16);
            background: linear-gradient(180deg, rgba(255, 248, 247, 0.98), rgba(255, 244, 242, 0.84));
        }

        .empty-card strong {
            display: block;
            margin-bottom: 10px;
            font-size: 18px;
            letter-spacing: -0.02em;
        }

        .empty-card p {
            margin: 0;
            color: var(--text-subtle);
            line-height: 1.6;
        }

        .pending-build-card {
            border-radius: 24px;
            border: 1px solid rgba(31, 111, 255, 0.18);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(247, 250, 255, 0.92)),
                linear-gradient(135deg, rgba(31, 111, 255, 0.08), rgba(15, 139, 109, 0.04));
            box-shadow: 0 16px 34px rgba(48, 41, 29, 0.08);
            min-height: 210px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .pending-build-kicker {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.01em;
            color: var(--accent);
        }

        .pending-build-title {
            font-size: 18px;
            font-weight: 800;
            line-height: 1.18;
            letter-spacing: -0.02em;
            word-break: keep-all;
        }

        .pending-build-name {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-subtle);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .pending-build-desc {
            margin: 0;
            font-size: 12px;
            line-height: 1.5;
            letter-spacing: -0.01em;
            color: var(--text-subtle);
            word-break: keep-all;
        }

        .pending-build-progress {
            width: 100%;
            height: 7px;
            margin-top: auto;
            border-radius: 999px;
            background: rgba(30, 31, 36, 0.08);
            overflow: hidden;
        }

        .pending-build-progress-bar {
            width: 42%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, rgba(31, 111, 255, 0.18), rgba(31, 111, 255, 0.72), rgba(15, 139, 109, 0.5));
            animation: drag-overlay-progress 1.1s ease-in-out infinite;
        }

        .bottom-controller {
            position: fixed;
            left: 18px;
            right: 18px;
            bottom: 18px;
            border-radius: 30px;
            border: 1px solid rgba(30, 31, 36, 0.08);
            background: rgba(252, 250, 247, 0.94);
            backdrop-filter: blur(20px);
            box-shadow: 0 24px 48px rgba(48, 41, 29, 0.14);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
            padding: 4px;
            z-index: 40;
        }

        .controller-group {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .controller-search-group {
            flex: 1 1 260px;
            min-width: 220px;
        }

        .controller-upload-group {
            flex: 0 0 auto;
        }

        .controller-search {
            width: 100%;
        }

        .weight-dropdown {
            min-width: 164px;
        }

        .category-dropdown {
            min-width: 156px;
        }

        .weight-trigger {
            min-width: 164px;
            padding-right: 14px;
        }

        .weight-menu {
            min-width: 180px;
        }

        .weight-option {
            min-height: 42px;
        }

        .size-dropdown {
            min-width: 116px;
        }

        .size-trigger {
            min-width: 116px;
            padding-right: 14px;
        }

        .size-menu {
            min-width: 132px;
        }

        .size-option {
            min-height: 42px;
        }

        .palette-dropdown {
            min-width: 152px;
        }

        .palette-trigger {
            min-width: 152px;
            padding-right: 14px;
        }

        .palette-trigger-content {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .palette-trigger-swatch,
        .palette-option-swatch {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--swatch, #1e1f24);
            box-shadow: inset 0 0 0 1px rgba(30, 31, 36, 0.08);
            flex: 0 0 auto;
        }

        .palette-menu {
            min-width: 172px;
        }

        .palette-option {
            min-height: 42px;
        }

        .palette-option-content {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .palette-option-label {
            white-space: nowrap;
        }

        .status-toast {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%) translateY(-8px);
            min-height: 48px;
            padding: 10px 18px;
            border-radius: 999px;
            background: rgba(30, 31, 36, 0.92);
            color: #fff;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 700;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s ease, transform 0.18s ease;
            z-index: 60;
        }

        .status-toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .status-toast.error {
            background: rgba(230, 76, 60, 0.94);
        }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible {
            outline: 3px solid rgba(31, 111, 255, 0.35);
            outline-offset: 3px;
        }

        @media (max-width: 900px) {
            .topbar {
                flex-wrap: wrap;
            }

            .topbar-controls {
                flex: 1 1 420px;
            }

            .hero-meta {
                justify-content: flex-start;
                align-items: flex-start;
            }

            .bottom-controller {
                flex-wrap: wrap;
                justify-content: flex-start;
                border-radius: 30px;
                padding: 4px;
                gap: 4px;
            }
        }

        @media (max-width: 640px) {
            .topbar {
                flex-direction: column;
                align-items: stretch;
                padding: 14px 14px 8px;
            }

            .content-scroll {
                padding: 0 14px calc(var(--controller-height) + 32px);
            }

            .drag-overlay {
                padding: 8px;
            }

            .bottom-controller {
                left: 14px;
                right: 14px;
                bottom: 14px;
            }

            .topbar-controls,
            .search-field,
            .filter-select,
            .category-dropdown,
            .controller-search,
            .weight-dropdown,
            .size-dropdown,
            .palette-dropdown,
            .upload-button {
                min-width: 100%;
                width: 100%;
            }

            .controller-group {
                flex-direction: column;
                align-items: stretch;
            }

            .library-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <span class="visually-hidden">IconFactory</span>
        </header>

        <main class="content-scroll">
            <div class="library-shell">
                <section class="library-hero">
                    <div class="hero-meta">
                        <span id="lastBuiltAt" class="meta-pill success">빌드 대기</span>
                    </div>
                </section>

                <section id="libraryGrid" class="library-grid" aria-live="polite"></section>
            </div>
        </main>
    </div>

    <div id="dragOverlay" class="drag-overlay" aria-hidden="true">
        <div id="dragOverlayCard" class="drag-overlay-card">
            <div id="dragOverlayKicker" class="drag-overlay-kicker">여기에 놓기</div>
            <div id="dragOverlayTitle" class="drag-overlay-title">SVG를 놓으면 웹폰트 라이브러리에 바로 반영됩니다.</div>
            <p id="dragOverlayDesc" class="drag-overlay-desc">놓는 즉시 전체 폰트를 다시 빌드하고, 성공한 결과만 라이브러리에 표시합니다.</p>
            <div class="drag-overlay-progress" aria-hidden="true">
                <div class="drag-overlay-progress-bar"></div>
            </div>
        </div>
        <div id="dragOverlayBuildLayer" class="drag-overlay-build-layer" aria-hidden="true"></div>
    </div>

    <aside id="bottomController" class="bottom-controller" aria-label="웹폰트 미리보기 컨트롤러">
        <div class="controller-group">
            <div class="category-dropdown dropdown dropdown--up">
                <button id="categoryTrigger" class="dropdown-trigger category-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="categoryMenu">
                    <span id="categoryTriggerLabel">전체</span>
                    <i id="categoryTriggerIcon" class="icon icon--chevron_down_line dropdown-trigger-icon" aria-hidden="true"></i>
                </button>
                <div id="categoryMenu" class="dropdown-menu category-menu" role="listbox" aria-label="카테고리 선택"></div>
            </div>
        </div>

        <div class="controller-group controller-search-group">
            <div class="search-combo controller-search">
                <div class="search-combo-shell">
                    <input id="searchInput" class="search-field" type="search" placeholder="아이콘 검색">
                </div>
            </div>
        </div>

        <div class="controller-group">
            <div class="weight-dropdown dropdown dropdown--up">
                <button id="weightTrigger" class="dropdown-trigger weight-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="weightMenu">
                    <span id="weightTriggerLabel">Regular 400</span>
                    <i id="weightTriggerIcon" class="icon icon--chevron_down_line dropdown-trigger-icon" aria-hidden="true"></i>
                </button>
                <div id="weightMenu" class="dropdown-menu weight-menu" role="listbox" aria-label="아이콘 두께 선택"></div>
            </div>
        </div>

        <div class="controller-group">
            <div class="size-dropdown dropdown dropdown--up">
                <button id="sizeTrigger" class="dropdown-trigger size-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="sizeMenu">
                    <span id="sizeTriggerLabel">24px</span>
                    <i id="sizeTriggerIcon" class="icon icon--chevron_down_line dropdown-trigger-icon size-trigger-icon" aria-hidden="true"></i>
                </button>
                <div id="sizeMenu" class="dropdown-menu size-menu" role="listbox" aria-label="아이콘 크기 선택"></div>
            </div>
        </div>

        <div class="controller-group">
            <div class="palette-dropdown dropdown dropdown--up">
                <button id="paletteTrigger" class="dropdown-trigger palette-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="paletteMenu">
                    <span class="palette-trigger-content">
                        <span id="paletteTriggerSwatch" class="palette-trigger-swatch" style="--swatch:#1e1f24"></span>
                        <span id="paletteTriggerLabel">Ink</span>
                    </span>
                    <i id="paletteTriggerIcon" class="icon icon--chevron_down_line dropdown-trigger-icon" aria-hidden="true"></i>
                </button>
                <div id="paletteMenu" class="dropdown-menu palette-menu" role="listbox" aria-label="컬러 팔레트 선택"></div>
            </div>
        </div>

        <div class="controller-group controller-upload-group">
            <button id="uploadButton" class="upload-button" type="button">SVG 업로드</button>
            <input id="uploadInput" class="visually-hidden" type="file" accept=".svg,image/svg+xml" multiple>
        </div>
    </aside>

    <div id="statusToast" class="status-toast" aria-live="polite"></div>

    <script>
        const CATEGORY_CONFIG = [
            { key: 'actions', label: '작업', keywords: ['add', 'remove', 'delete', 'copy', 'edit', 'replace', 'refresh', 'recover', 'restore', 'resend', 'reset', 'merge', 'approve', 'cancel', 'upload'] },
            { key: 'navigation', label: '탐색', keywords: ['arrow', 'chevron', 'forward', 'back', 'move', 'fullscreen', 'maximize', 'minimize'] },
            { key: 'communication', label: '커뮤니케이션', keywords: ['message', 'comment', 'email', 'reply', 'mention', 'chat', 'notification', 'megaphone'] },
            { key: 'files', label: '파일/폴더', keywords: ['file', 'folder', 'document', 'attachment', 'drive', 'image'] },
            { key: 'user', label: '사용자/조직', keywords: ['user', 'manager', 'organization', 'group'] },
            { key: 'security', label: '보안', keywords: ['lock', 'unlock', 'permission', 'security', 'key', 'shield'] },
            { key: 'status', label: '상태/피드백', keywords: ['info', 'error', 'favorite', 'thumbs', 'sparkle'] },
            { key: 'layout', label: '레이아웃/정렬', keywords: ['align', 'bullet', 'grid', 'table', 'sort', 'filter', 'flowchart'] },
            { key: 'device', label: '시스템/디바이스', keywords: ['device', 'cpu', 'smartphone', 'storage', 'globe', 'ip', 'bot', 'application', 'mouse'] },
            { key: 'time', label: '시간/일정', keywords: ['time', 'date', 'datetime', 'schedule', 'timer'] }
        ];

        const weightNames = {
            300: 'Light',
            400: 'Regular',
            500: 'Medium',
            600: 'SemiBold',
            700: 'Bold'
        };

        const previewWeights = [300, 400, 500, 600, 700];
        const previewSizes = [20, 24, 28, 32, 40, 48, 64];
        const PALETTE_OPTIONS = [
            { key: 'ink', label: 'Ink', color: '#1e1f24' },
            { key: 'signal-blue', label: 'Signal Blue', color: '#1f6fff' },
            { key: 'moss', label: 'Moss', color: '#0f8b6d' },
            { key: 'amber', label: 'Amber', color: '#b86a2d' },
            { key: 'violet', label: 'Violet', color: '#7a3ff2' }
        ];

        const state = {
            icons: [],
            pendingBuilds: [],
            category: 'all',
            query: '',
            previewWeight: 400,
            previewSize: 24,
            previewColor: '#1e1f24',
            isUploading: false,
            loadError: false
        };

        const uploadButton = document.getElementById('uploadButton');
        const uploadInput = document.getElementById('uploadInput');
        const dragOverlay = document.getElementById('dragOverlay');
        const dragOverlayCard = document.getElementById('dragOverlayCard');
        const dragOverlayBuildLayer = document.getElementById('dragOverlayBuildLayer');
        const dragOverlayKicker = document.getElementById('dragOverlayKicker');
        const dragOverlayTitle = document.getElementById('dragOverlayTitle');
        const dragOverlayDesc = document.getElementById('dragOverlayDesc');
        const bottomController = document.getElementById('bottomController');
        const searchInput = document.getElementById('searchInput');
        const categoryDropdown = document.querySelector('.category-dropdown');
        const categoryTrigger = document.getElementById('categoryTrigger');
        const categoryTriggerLabel = document.getElementById('categoryTriggerLabel');
        const categoryTriggerIcon = document.getElementById('categoryTriggerIcon');
        const categoryMenu = document.getElementById('categoryMenu');
        const libraryGrid = document.getElementById('libraryGrid');
        const lastBuiltAt = document.getElementById('lastBuiltAt');
        const weightDropdown = document.querySelector('.weight-dropdown');
        const weightTrigger = document.getElementById('weightTrigger');
        const weightTriggerLabel = document.getElementById('weightTriggerLabel');
        const weightTriggerIcon = document.getElementById('weightTriggerIcon');
        const weightMenu = document.getElementById('weightMenu');
        const sizeDropdown = document.querySelector('.size-dropdown');
        const sizeTrigger = document.getElementById('sizeTrigger');
        const sizeTriggerLabel = document.getElementById('sizeTriggerLabel');
        const sizeTriggerIcon = document.getElementById('sizeTriggerIcon');
        const sizeMenu = document.getElementById('sizeMenu');
        const paletteDropdown = document.querySelector('.palette-dropdown');
        const paletteTrigger = document.getElementById('paletteTrigger');
        const paletteTriggerLabel = document.getElementById('paletteTriggerLabel');
        const paletteTriggerSwatch = document.getElementById('paletteTriggerSwatch');
        const paletteTriggerIcon = document.getElementById('paletteTriggerIcon');
        const paletteMenu = document.getElementById('paletteMenu');
        const statusToast = document.getElementById('statusToast');
        const generatedFontStyle = document.getElementById('generatedFontStyle');
        const dropdownComponents = [];
        let dragOverlayHideTimer = null;
        let dragOverlayResetTimer = null;

        function classifyGlyph(glyphKey) {
            const normalized = glyphKey.replace(/_(fill|line)$/u, '');
            for (const category of CATEGORY_CONFIG) {
                if (category.keywords.some((keyword) => normalized.includes(keyword))) {
                    return category.key;
                }
            }
            return 'misc';
        }

        function getCategoryLabel(categoryKey) {
            if (categoryKey === 'all') return '전체';
            if (categoryKey === 'misc') return '기타';
            const match = CATEGORY_CONFIG.find((item) => item.key === categoryKey);
            return match ? match.label : categoryKey;
        }

        function getVisibleIcons() {
            const query = state.query.trim().toLowerCase();
            return state.icons.filter((icon) => {
                const matchesCategory = state.category === 'all' || icon.category === state.category;
                const matchesQuery = query === '' || (icon.searchText || '').includes(query) || icon.displayName.toLowerCase().includes(query);
                return matchesCategory && matchesQuery;
            });
        }

        function formatPendingBuildName(fileName = '') {
            return fileName.replace(/\.svg$/i, '');
        }

        function getCategoryOptions() {
            const counts = state.icons.reduce((map, icon) => {
                map[icon.category] = (map[icon.category] || 0) + 1;
                return map;
            }, {});

            const options = [{ key: 'all', count: state.icons.length }];
            CATEGORY_CONFIG.forEach((category) => {
                if (counts[category.key]) {
                    options.push({ key: category.key, count: counts[category.key] });
                }
            });
            if (counts.misc) {
                options.push({ key: 'misc', count: counts.misc });
            }

            return options;
        }

        function closeAllDropdowns(except = null) {
            dropdownComponents.forEach((component) => {
                if (component !== except) {
                    component.close();
                }
            });
        }

        function createDropdownComponent({
            root,
            trigger,
            triggerLabel,
            triggerIcon,
            menu,
            optionClassName,
            getOptions,
            getActiveOption,
            getOptionValue,
            formatTriggerLabel,
            formatOptionLabel,
            renderOptionContent,
            onPopulateTrigger,
            onSelect
        }) {
            const closedIconClass = triggerIcon.className;
            const openIconClass = closedIconClass.replace('chevron_down_line', 'chevron_up_line');

            function close() {
                root.classList.remove('open');
                trigger.setAttribute('aria-expanded', 'false');
                triggerIcon.className = closedIconClass;
            }

            function open() {
                closeAllDropdowns(component);
                root.classList.add('open');
                trigger.setAttribute('aria-expanded', 'true');
                triggerIcon.className = openIconClass;
            }

            function toggle() {
                if (root.classList.contains('open')) {
                    close();
                } else {
                    open();
                }
            }

            function populate() {
                const options = getOptions();
                const activeOption = getActiveOption(options) || options[0];
                if (!activeOption) {
                    menu.innerHTML = '';
                    return;
                }

                triggerLabel.textContent = formatTriggerLabel(activeOption, options);
                onPopulateTrigger?.(activeOption, options);
                menu.innerHTML = options.map((optionData) => {
                    const value = String(getOptionValue(optionData));
                    const selected = getOptionValue(activeOption) === getOptionValue(optionData);
                    const optionContent = renderOptionContent
                        ? renderOptionContent(optionData, selected)
                        : `<span>${formatOptionLabel(optionData)}</span>`;
                    return `
                        <button
                            type="button"
                            class="dropdown-option ${optionClassName}${selected ? ' active' : ''}"
                            data-dropdown-value="${escapeHtml(value)}"
                            role="option"
                            aria-selected="${selected ? 'true' : 'false'}"
                        >
                            ${optionContent}
                        </button>
                    `;
                }).join('');
            }

            trigger.addEventListener('click', () => {
                toggle();
            });

            trigger.addEventListener('keydown', (event) => {
                if (event.key === 'ArrowDown' || event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    open();
                    menu.querySelector('.dropdown-option.active, .dropdown-option')?.focus();
                }
            });

            menu.addEventListener('click', (event) => {
                const option = event.target.closest('.dropdown-option');
                if (!option) return;
                onSelect(option.dataset.dropdownValue || '');
                populate();
                close();
                trigger.focus();
            });

            const component = { root, trigger, menu, close, open, toggle, populate };
            dropdownComponents.push(component);
            return component;
        }

        const categoryDropdownComponent = createDropdownComponent({
            root: categoryDropdown,
            trigger: categoryTrigger,
            triggerLabel: categoryTriggerLabel,
            triggerIcon: categoryTriggerIcon,
            menu: categoryMenu,
            optionClassName: 'category-option',
            getOptions: getCategoryOptions,
            getActiveOption: (options) => {
                if (!options.some((optionData) => optionData.key === state.category)) {
                    state.category = 'all';
                }
                return options.find((optionData) => optionData.key === state.category) || options[0];
            },
            getOptionValue: (optionData) => optionData.key,
            formatTriggerLabel: (optionData) => `${getCategoryLabel(optionData.key)} (${optionData.count})`,
            formatOptionLabel: (optionData) => `${getCategoryLabel(optionData.key)} (${optionData.count})`,
            onSelect: (value) => {
                state.category = value || 'all';
                renderGrid();
            }
        });

        const weightDropdownComponent = createDropdownComponent({
            root: weightDropdown,
            trigger: weightTrigger,
            triggerLabel: weightTriggerLabel,
            triggerIcon: weightTriggerIcon,
            menu: weightMenu,
            optionClassName: 'weight-option',
            getOptions: () => previewWeights,
            getActiveOption: (options) => options.find((weight) => weight === state.previewWeight) || options[0],
            getOptionValue: (weight) => String(weight),
            formatTriggerLabel: (weight) => `${weightNames[weight]} ${weight}`,
            formatOptionLabel: (weight) => `${weightNames[weight]} ${weight}`,
            onSelect: (value) => {
                state.previewWeight = Number(value || state.previewWeight);
                applyPreviewStyles();
            }
        });

        const sizeDropdownComponent = createDropdownComponent({
            root: sizeDropdown,
            trigger: sizeTrigger,
            triggerLabel: sizeTriggerLabel,
            triggerIcon: sizeTriggerIcon,
            menu: sizeMenu,
            optionClassName: 'size-option',
            getOptions: () => previewSizes,
            getActiveOption: (options) => options.find((size) => size === state.previewSize) || options[0],
            getOptionValue: (size) => String(size),
            formatTriggerLabel: (size) => `${size}px`,
            formatOptionLabel: (size) => `${size}px`,
            onSelect: (value) => {
                state.previewSize = Number(value || state.previewSize);
                applyPreviewStyles();
            }
        });

        const paletteDropdownComponent = createDropdownComponent({
            root: paletteDropdown,
            trigger: paletteTrigger,
            triggerLabel: paletteTriggerLabel,
            triggerIcon: paletteTriggerIcon,
            menu: paletteMenu,
            optionClassName: 'palette-option',
            getOptions: () => PALETTE_OPTIONS,
            getActiveOption: (options) => options.find((option) => option.color === state.previewColor) || options[0],
            getOptionValue: (option) => option.color,
            formatTriggerLabel: (option) => option.label,
            formatOptionLabel: (option) => option.label,
            renderOptionContent: (option) => `
                <span class="palette-option-content">
                    <span class="palette-option-swatch" style="--swatch:${escapeHtml(option.color)}"></span>
                    <span class="palette-option-label">${escapeHtml(option.label)}</span>
                </span>
            `,
            onPopulateTrigger: (option) => {
                paletteTriggerSwatch.style.setProperty('--swatch', option.color);
            },
            onSelect: (value) => {
                state.previewColor = value || state.previewColor;
                applyPreviewStyles();
            }
        });

        function syncControllerHeight() {
            const height = bottomController?.offsetHeight || 116;
            document.documentElement.style.setProperty('--controller-height', `${Math.ceil(height)}px`);
        }

        function setUploadAvailability() {
            const busy = state.isUploading;
            uploadButton.disabled = busy;
            uploadButton.textContent = busy ? '빌드 중...' : 'SVG 업로드';
            uploadInput.disabled = busy;
        }

        function hasFilePayload(event) {
            return Array.from(event.dataTransfer?.types || []).includes('Files');
        }

        function setDragOverlayCopy({ kicker, title, desc }) {
            dragOverlayKicker.textContent = kicker;
            dragOverlayTitle.textContent = title;
            dragOverlayDesc.textContent = desc;
        }

        function escapeHtml(value = '') {
            return value
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        function resetDragOverlayCardLayout() {
            clearTimeout(dragOverlayResetTimer);
            dragOverlay.classList.remove('is-build', 'is-success');
            dragOverlayCard.classList.remove('is-build', 'is-success');
            dragOverlayCard.style.removeProperty('--build-left');
            dragOverlayCard.style.removeProperty('--build-top');
            dragOverlayCard.style.removeProperty('--build-width');
            dragOverlayCard.style.removeProperty('--build-height');
            dragOverlayBuildLayer.innerHTML = '';
            setDragOverlayCopy({
                kicker: '여기에 놓기',
                title: 'SVG를 놓으면 웹폰트 라이브러리에 바로 반영됩니다.',
                desc: '놓는 즉시 전체 폰트를 다시 빌드하고, 성공한 결과만 라이브러리에 표시합니다.'
            });
        }

        function getBuildOverlayTargetRects(count) {
            const firstCard = libraryGrid.querySelector('.icon-card');
            const gridRect = libraryGrid.getBoundingClientRect();
            const gridStyle = window.getComputedStyle(libraryGrid);
            const columnGap = Number.parseFloat(gridStyle.columnGap || gridStyle.gap) || 16;
            const rowGap = Number.parseFloat(gridStyle.rowGap || gridStyle.gap) || 16;
            const templateColumns = gridStyle.gridTemplateColumns.split(' ').filter(Boolean);
            const columnCount = Math.max(1, templateColumns.length || 1);

            let width;
            let height;
            if (firstCard) {
                const sampleRect = firstCard.getBoundingClientRect();
                width = sampleRect.width;
                height = sampleRect.height;
            } else {
                width = Math.max(170, (gridRect.width - columnGap * (columnCount - 1)) / columnCount);
                height = 210;
            }

            return Array.from({ length: count }, (_, index) => {
                const row = Math.floor(index / columnCount);
                const col = index % columnCount;
                return {
                    left: gridRect.left + col * (width + columnGap),
                    top: gridRect.top + row * (height + rowGap),
                    width,
                    height
                };
            });
        }

        function renderBuildOverlayCards(fileNames) {
            const targetRects = getBuildOverlayTargetRects(fileNames.length);

            dragOverlayBuildLayer.innerHTML = fileNames.map((fileName, index) => {
                const safeName = escapeHtml(fileName.replace(/\.svg$/i, ''));
                const target = targetRects[index];
                return `
                    <div
                        class="drag-overlay-build-card"
                        style="
                            --card-left:${Math.round(target.left)}px;
                            --card-top:${Math.round(target.top)}px;
                            --card-width:${Math.round(target.width)}px;
                            --card-height:${Math.round(target.height)}px;
                            --card-delay:${Math.min(index * 36, 240)}ms;
                        "
                    >
                        <div class="drag-overlay-build-kicker">${fileNames.length > 1 ? `${index + 1}/${fileNames.length}` : '변환 중'}</div>
                        <div class="drag-overlay-build-name">${safeName}</div>
                        <p class="drag-overlay-build-desc">웹폰트로 변환 중</p>
                        <div class="drag-overlay-build-progress" aria-hidden="true">
                            <div class="drag-overlay-build-progress-bar"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function activateBuildOverlay(fileNames) {
            clearTimeout(dragOverlayResetTimer);
            setDragOverlayCopy({
                kicker: fileNames.length > 1 ? `${fileNames.length}개 변환 중` : '변환 중',
                title: '웹폰트로 변환 중',
                desc: 'SVG를 정리하고 폰트를 빌드하고 있습니다'
            });
            renderBuildOverlayCards(fileNames);

            dragOverlay.classList.add('visible');
            dragOverlay.setAttribute('aria-hidden', 'false');

            requestAnimationFrame(() => {
                dragOverlay.classList.add('is-build');
                dragOverlayCard.classList.remove('is-success');
            });
        }

        function finishBuildOverlay(success = true) {
            if (!dragOverlay.classList.contains('visible')) {
                return;
            }

            if (success) {
                dragOverlay.classList.add('is-success');
                dragOverlayCard.classList.add('is-success');
                setDragOverlayCopy({
                    kicker: '반영 완료',
                    title: '라이브러리에 반영되었습니다',
                    desc: '새 아이콘을 바로 확인할 수 있습니다'
                });
                dragOverlayResetTimer = setTimeout(() => {
                    hideDragOverlay();
                }, 880);
                return;
            }

            hideDragOverlay();
        }

        function showDragOverlay() {
            if (state.isUploading) return;
            clearTimeout(dragOverlayHideTimer);
            resetDragOverlayCardLayout();
            dragOverlay.classList.add('visible');
            dragOverlay.setAttribute('aria-hidden', 'false');
        }

        function hideDragOverlay(immediate = true) {
            clearTimeout(dragOverlayHideTimer);
            clearTimeout(dragOverlayResetTimer);
            if (!immediate) {
                dragOverlayHideTimer = setTimeout(() => {
                    dragOverlay.classList.remove('visible');
                    dragOverlay.setAttribute('aria-hidden', 'true');
                    resetDragOverlayCardLayout();
                }, 90);
                return;
            }
            dragOverlay.classList.remove('visible');
            dragOverlay.setAttribute('aria-hidden', 'true');
            resetDragOverlayCardLayout();
        }

        function applyPreviewStyles() {
            document.documentElement.style.setProperty('--preview-color', state.previewColor);
            document.documentElement.style.setProperty('--preview-size', `${state.previewSize}px`);
            document.documentElement.style.setProperty('--preview-weight', `${state.previewWeight}`);
            weightTriggerLabel.textContent = `${weightNames[state.previewWeight]} ${state.previewWeight}`;
        }

        function renderGrid() {
            const visibleIcons = getVisibleIcons();
            const pendingCards = state.pendingBuilds.map((build, index) => `
                <article class="pending-build-card">
                    <div class="pending-build-kicker">${state.pendingBuilds.length > 1 ? `${index + 1}/${state.pendingBuilds.length}` : '변환 중'}</div>
                    <div class="pending-build-title">웹폰트로 변환 중</div>
                    <div class="pending-build-name">${escapeHtml(build.label)}</div>
                    <p class="pending-build-desc">SVG를 정리하고 폰트를 빌드하고 있습니다</p>
                    <div class="pending-build-progress" aria-hidden="true">
                        <div class="pending-build-progress-bar"></div>
                    </div>
                </article>
            `).join('');

            if (state.loadError) {
                libraryGrid.innerHTML = `
                    <article class="empty-card error-state">
                        <div>
                            <strong>빌드된 라이브러리를 불러오지 못했습니다.</strong>
                            <p>서버 상태를 확인한 뒤 다시 새로고침하거나, 업로드 후 자동 빌드를 다시 시도해보세요.</p>
                        </div>
                    </article>
                `;
                return;
            }

            if (visibleIcons.length === 0 && state.pendingBuilds.length === 0) {
                libraryGrid.innerHTML = `
                    <article class="empty-card">
                        <div>
                            <strong>${state.icons.length === 0 ? '아직 빌드된 웹폰트 아이콘이 없습니다.' : '조건에 맞는 웹폰트 아이콘이 없습니다.'}</strong>
                            <p>${state.icons.length === 0 ? 'SVG를 업로드하면 자동 빌드 후 라이브러리에 바로 반영됩니다.' : '검색어를 바꾸거나 카테고리를 다시 선택해보세요.'}</p>
                        </div>
                    </article>
                `;
                return;
            }

            libraryGrid.innerHTML = `${pendingCards}${visibleIcons.map((icon) => `
                <article class="icon-card">
                    <div class="card-top">
                        <span class="kind-pill ${icon.kind}">${icon.kind}</span>
                        <span class="card-subtitle">${getCategoryLabel(icon.category)}</span>
                    </div>
                    <div class="card-icon-wrap">
                        <i class="icon ${icon.className} library-icon" aria-hidden="true"></i>
                    </div>
                    <div class="card-label">
                        <div class="card-title">${icon.displayName}</div>
                    </div>
                    <div class="card-devtools">
                        <div class="card-devtools-key">${escapeHtml(icon.key)}</div>
                        <button type="button" class="card-copy-button" data-copy-value="${escapeHtml(icon.key)}">Copy</button>
                    </div>
                </article>
            `).join('')}`;
        }

        function showToast(message, isError = false) {
            statusToast.textContent = message;
            statusToast.classList.toggle('error', isError);
            statusToast.classList.add('visible');
            clearTimeout(showToast.timer);
            showToast.timer = setTimeout(() => {
                statusToast.classList.remove('visible');
                statusToast.classList.remove('error');
            }, 2600);
        }

        async function refreshGeneratedFontStyles(options = {}) {
            const required = options.required === true;
            const version = options.version || Date.now();
            const response = await fetch(`/generated-fonts/my-icon-font.css?v=${version}`, { cache: 'no-store' });

            if (!response.ok) {
                if (!required && response.status === 404) {
                    generatedFontStyle.textContent = '';
                    return false;
                }

                throw new Error('빌드된 웹폰트 스타일을 불러오지 못했습니다.');
            }

            const css = await response.text();
            generatedFontStyle.textContent = css.replace(
                /url\((['"]?)(?:\.\/)?(MyIconFont-[^)'"?]+\.woff2)\1\)/g,
                `url('/generated-fonts/$2?v=${version}')`
            );
            return true;
        }

        async function loadLibrary() {
            const response = await fetch('/api/library-icons');
            if (!response.ok) {
                throw new Error('빌드된 라이브러리를 불러오지 못했습니다.');
            }

            const payload = await response.json();
            state.icons = (payload.icons || []).map((icon) => ({
                ...icon,
                category: icon.category || classifyGlyph(icon.key)
            }));
            state.loadError = false;

            categoryDropdownComponent.populate();
            renderGrid();
            if (payload.lastBuiltAt) {
                lastBuiltAt.textContent = `Last build ${new Date(payload.lastBuiltAt).toLocaleString()}`;
            } else {
                lastBuiltAt.textContent = '빌드 대기';
            }
        }

        async function uploadFiles(fileList) {
            if (state.isUploading) {
                return;
            }

            const svgFiles = Array.from(fileList).filter((file) => file.name.toLowerCase().endsWith('.svg'));
            if (svgFiles.length === 0) {
                showToast('SVG 파일만 업로드할 수 있습니다.', true);
                return;
            }

            state.isUploading = true;
            state.pendingBuilds = svgFiles.map((file, index) => ({
                id: `${Date.now()}-${index}`,
                label: formatPendingBuildName(file.name)
            }));
            setUploadAvailability();
            hideDragOverlay();
            renderGrid();
            showToast(`${svgFiles.length}개의 아이콘을 업로드하고 빌드합니다...`);

            try {
                const files = await Promise.all(svgFiles.map(async (file) => ({
                    name: file.name,
                    content: await file.text()
                })));

                const response = await fetch('/api/upload-icons', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ files })
                });

                const payload = await response.json();
                if (!response.ok) {
                    throw new Error(payload.error || 'upload failed');
                }

                try {
                    await refreshGeneratedFontStyles({ required: true, version: Date.now() });
                    await loadLibrary();
                } catch (error) {
                    state.pendingBuilds = [];
                    state.loadError = true;
                    renderGrid();
                    throw error;
                }

                state.pendingBuilds = [];
                renderGrid();
                showToast(`${payload.count}개의 아이콘이 라이브러리에 반영되었습니다.`);
            } catch (error) {
                state.pendingBuilds = [];
                renderGrid();
                throw error;
            } finally {
                state.isUploading = false;
                setUploadAvailability();
            }
        }

        function bindUploadTriggers() {
            uploadButton.addEventListener('click', () => {
                if (state.isUploading) return;
                uploadInput.click();
            });

            uploadInput.addEventListener('change', async (event) => {
                if (event.target.files?.length) {
                    try {
                        await uploadFiles(event.target.files);
                    } catch (error) {
                        showToast(error.message, true);
                    } finally {
                        uploadInput.value = '';
                    }
                }
            });

            window.addEventListener('dragenter', (event) => {
                if (!hasFilePayload(event)) {
                    return;
                }
                event.preventDefault();
                showDragOverlay();
            });

            window.addEventListener('dragover', (event) => {
                if (!hasFilePayload(event)) {
                    return;
                }
                event.preventDefault();
                showDragOverlay();
            });

            window.addEventListener('dragleave', (event) => {
                if (!hasFilePayload(event)) {
                    return;
                }
                event.preventDefault();
                hideDragOverlay(false);
            });

            window.addEventListener('drop', async (event) => {
                if (!hasFilePayload(event)) {
                    return;
                }
                event.preventDefault();
                if (state.isUploading) return;
                const files = event.dataTransfer?.files;
                if (!files?.length) return;
                try {
                    await uploadFiles(files);
                } catch (error) {
                    showToast(error.message, true);
                }
            });
        }

        function initController() {
            weightDropdownComponent.populate();
            sizeDropdownComponent.populate();
            paletteDropdownComponent.populate();

            applyPreviewStyles();
        }

        searchInput.addEventListener('input', (event) => {
            state.query = event.target.value || '';
            renderGrid();
        });

        document.addEventListener('click', (event) => {
            if (!dropdownComponents.some((component) => component.root.contains(event.target))) {
                closeAllDropdowns();
            }
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                closeAllDropdowns();
            }
        });

        libraryGrid.addEventListener('click', async (event) => {
            const copyButton = event.target.closest('.card-copy-button');
            if (!copyButton) {
                return;
            }

            const value = copyButton.dataset.copyValue || '';
            if (!value) {
                return;
            }

            try {
                await navigator.clipboard.writeText(value);
                showToast(`클래스 키를 복사했습니다: ${value}`);
            } catch (error) {
                showToast('복사에 실패했습니다.', true);
            }
        });

        initController();
        setUploadAvailability();
        bindUploadTriggers();
        syncControllerHeight();

        if (typeof ResizeObserver === 'function') {
            const resizeObserver = new ResizeObserver(() => syncControllerHeight());
            resizeObserver.observe(bottomController);
        } else {
            window.addEventListener('resize', syncControllerHeight);
        }

        refreshGeneratedFontStyles()
            .then(() => loadLibrary())
            .catch((error) => {
                state.loadError = true;
                showToast(error.message, true);
                renderGrid();
            });
    </script>
</body>
</html>
