<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IconFactory Webfont Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style id="generatedFontStyle"></style>
    <style>
        :root {
            --bg: #f6f3ee;
            --bg-rgb: 246, 243, 238;
            --bg-accent: #ebe4d8;
            --surface: rgba(255, 255, 255, 0.88);
            --surface-strong: #ffffff;
            --text: #1e1f24;
            --text-subtle: #6d6e76;
            --line: rgba(30, 31, 36, 0.08);
            --line-strong: rgba(30, 31, 36, 0.18);
            --shadow: 0 18px 40px rgba(45, 37, 24, 0.08);
            --accent: #1f6fff;
            --accent-soft: rgba(31, 111, 255, 0.12);
            --success: #0f8b6d;
            --success-soft: rgba(15, 139, 109, 0.12);
            --danger: #e64c3c;
            --controller-height: 116px;
            --preview-color: #1e1f24;
            --preview-size: 24px;
            --preview-weight: 400;
            --font-main: 'Manrope', sans-serif;
            --font-mono: 'IBM Plex Mono', monospace;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
        }

        body {
            font-family: var(--font-main);
            color: var(--text);
            /*
            background:
                radial-gradient(circle at top left, rgba(255, 255, 255, 0.95) 0, rgba(255, 255, 255, 0) 32%),
                radial-gradient(circle at top right, rgba(235, 228, 216, 0.92) 0, rgba(235, 228, 216, 0) 35%),
                linear-gradient(180deg, #fbfaf8 0%, var(--bg) 50%, #f1eee8 100%);
            */
            background: var(--bg);
            overflow: hidden;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .app-shell {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .topbar-controls {
            display: flex;
            align-items: center;
            flex: 1 1 auto;
            min-width: 0;
        }

        .search-combo {
            position: relative;
            width: 100%;
        }

        .search-combo-shell {
            min-height: 48px;
            display: flex;
            align-items: center;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.74);
            box-shadow: 0 10px 24px rgba(48, 41, 29, 0.04);
            overflow: hidden;
        }

        .search-field::-webkit-search-cancel-button {
            appearance: none;
        }

        .search-combo:hover .search-combo-shell,
        .search-combo:focus-within .search-combo-shell {
            border-color: var(--line-strong);
            box-shadow: inset 0 0 0 1px var(--line-strong), 0 14px 32px rgba(48, 41, 29, 0.08);
        }

        .search-clear-button {
            width: 40px;
            height: 40px;
            margin-right: 4px;
            border: 0;
            border-radius: 999px;
            background: transparent;
            color: rgba(30, 31, 36, 0.52);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.16s ease, color 0.16s ease, background-color 0.16s ease;
        }

        .search-clear-button:hover,
        .search-clear-button:focus-visible {
            background: rgba(30, 31, 36, 0.06);
            color: rgba(30, 31, 36, 0.82);
            outline: none;
        }

        .search-clear-button .icon {
            font-size: 20px;
            line-height: 1;
        }

        .search-combo.has-value .search-clear-button {
            opacity: 1;
            pointer-events: auto;
        }

        .dropdown {
            position: relative;
        }

        .dropdown-trigger {
            min-height: 48px;
            padding: 0 12px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.42);
            -webkit-backdrop-filter: blur(12px) saturate(135%);
            backdrop-filter: blur(12px) saturate(135%);
            box-shadow: 0 10px 24px rgba(48, 41, 29, 0.04);
            color: var(--text);
            display: inline-flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: -0.02em;
            text-align: left;
        }

        .dropdown-trigger-icon {
            font-size: 20px;
            line-height: 1;
            pointer-events: none;
            color: rgba(30, 31, 36, 0.78);
            flex: 0 0 auto;
        }

        .dropdown.open .dropdown-trigger {
            border-color: var(--line-strong);
            box-shadow: inset 0 0 0 1px var(--line-strong), 0 14px 32px rgba(48, 41, 29, 0.08);
        }

        .dropdown-trigger:hover,
        .dropdown-trigger:focus-visible {
            border-color: var(--line-strong);
            box-shadow: inset 0 0 0 1px var(--line-strong), 0 14px 32px rgba(48, 41, 29, 0.08);
        }

        .dropdown-menu {
            position: absolute;
            min-width: 220px;
            padding: 8px;
            overflow: hidden;
            border-radius: 20px;
            border: 1px solid rgba(30, 31, 36, 0.08);
            background: rgba(255, 255, 255, 0.62);
            -webkit-backdrop-filter: blur(18px) saturate(145%);
            backdrop-filter: blur(18px) saturate(145%);
            box-shadow: 0 10px 24px rgba(48, 41, 29, 0.08);
            display: none;
            flex-direction: column;
            gap: 4px;
            z-index: 40;
        }

        .dropdown.open .dropdown-menu {
            display: flex;
        }

        .dropdown--down .dropdown-menu {
            top: calc(100% + 10px);
            left: 0;
            transform-origin: top left;
        }

        .dropdown--up .dropdown-menu {
            bottom: calc(100% + 10px);
            right: 0;
            transform-origin: bottom right;
            box-shadow: 0 -10px 24px rgba(48, 41, 29, 0.08);
        }

        .dropdown-option {
            min-height: 42px;
            padding: 0 14px;
            border: 0;
            border-radius: 14px;
            background: transparent;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: -0.02em;
            text-align: left;
        }

        .dropdown-option:hover {
            background: rgba(30, 31, 36, 0.05);
        }

        .dropdown-option.active {
            background: rgba(31, 111, 255, 0.1);
            color: var(--accent);
        }

        .dropdown-option-check {
            font-size: 20px;
            line-height: 1;
            flex: 0 0 auto;
        }

        .category-trigger {
            min-width: 156px;
            flex: 0 0 156px;
            padding-right: 14px;
        }

        .kind-trigger {
            min-width: 96px;
            flex: 0 0 96px;
            padding-right: 14px;
        }

        .category-menu {
            min-width: 220px;
            left: 0;
            right: auto;
            transform-origin: bottom left;
        }

        .kind-menu {
            min-width: 132px;
            left: 0;
            right: auto;
            transform-origin: bottom left;
        }

        .category-option {
            min-height: 42px;
        }

        .upload-button {
            min-height: 48px;
            padding: 0 4px;
            border-radius: 999px;
            border: 1px solid rgba(30, 31, 36, 0.08);
            background: rgba(255, 255, 255, 0.4);
            -webkit-backdrop-filter: blur(12px) saturate(135%);
            backdrop-filter: blur(12px) saturate(135%);
            box-shadow: 0 8px 24px rgba(48, 41, 29, 0.08);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            color: var(--text);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: -0.02em;
            position: relative;
            transition: background-color 0.18s ease, border-color 0.18s ease, border-width 0.18s ease, box-shadow 0.18s ease;
        }

        .upload-button-icon {
            font-size: 40px;
            line-height: 1;
            flex: 0 0 auto;
            color: var(--success);
        }

        .upload-button::after {
            content: attr(data-tooltip);
            position: absolute;
            left: 50%;
            bottom: calc(100% + 12px);
            transform: translateX(-50%) translateY(6px);
            min-height: 32px;
            padding: 0 12px;
            border-radius: 999px;
            background: rgba(30, 31, 36, 0.92);
            color: #fff;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: -0.01em;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.16s ease, transform 0.16s ease;
        }

        .upload-button:hover,
        .upload-button:focus-visible {
            background: rgba(255, 255, 255, 0.4);
            border-color: var(--line-strong);
            box-shadow: inset 0 0 0 1px var(--line-strong), 0 14px 32px rgba(48, 41, 29, 0.08);
        }

        .upload-button:hover::after,
        .upload-button:focus-visible::after {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .upload-button:disabled {
            cursor: progress;
            transform: none;
            box-shadow: 0 8px 24px rgba(48, 41, 29, 0.08);
            opacity: 0.72;
        }

        .upload-button:disabled::after {
            display: none;
        }

        .content-scroll {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 0 24px calc(var(--controller-height) + 28px);
        }

        .library-shell {
            max-width: 1400px;
            margin: 0 auto;
            padding-bottom: 0;
        }

        .library-hero {
            padding: 10px 0 8px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 30;
            isolation: isolate;
        }

        .library-hero-gradient {
            position: absolute;
            left: 50%;
            top: 0;
            width: 100vw;
            height: 60px;
            transform: translateX(-50%);
            background: linear-gradient(
                180deg,
                rgba(var(--bg-rgb), 1) 50%,
                rgba(var(--bg-rgb), 0.5) 80%,
                rgba(var(--bg-rgb), 0) 100%
            );
            pointer-events: none;
            z-index: 0;
            transition: background 0.22s ease;
        }

        .library-hero.is-scrolled .library-hero-gradient {
            background: linear-gradient(
                180deg,
                rgba(var(--bg-rgb), 1) 0%,
                rgba(var(--bg-rgb), 0.75) 45%,
                rgba(var(--bg-rgb), 0.2) 80%,
                rgba(var(--bg-rgb), 0) 100%
            );
        }

        .hero-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: space-between;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .hero-meta-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
            margin-left: auto;
            overflow: visible;
        }

        .hero-view-toggle {
            min-height: 40px;
            padding: 0 12px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.42);
            -webkit-backdrop-filter: blur(12px) saturate(135%);
            backdrop-filter: blur(12px) saturate(135%);
            color: var(--text);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: -0.01em;
            cursor: pointer;
            appearance: none;
            box-shadow: 0 8px 24px rgba(48, 41, 29, 0.08);
            position: relative;
            overflow: visible;
            z-index: 1;
        }

        .hero-view-toggle:hover,
        .hero-view-toggle:focus-visible {
            border-color: var(--line-strong);
            box-shadow: inset 0 0 0 1px var(--line-strong), 0 14px 32px rgba(48, 41, 29, 0.08);
        }

        .hero-view-toggle::after {
            content: attr(data-tooltip);
            position: absolute;
            left: 50%;
            top: calc(100% + 12px);
            transform: translateX(-50%) translateY(6px);
            min-height: 32px;
            padding: 0 12px;
            border-radius: 999px;
            background: rgba(30, 31, 36, 0.92);
            color: #fff;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: -0.01em;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            z-index: 60;
            transition: opacity 0.16s ease, transform 0.16s ease;
        }

        .hero-view-toggle:hover::after,
        .hero-view-toggle:focus-visible::after {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .hero-view-icon {
            font-size: 18px;
            line-height: 1;
            flex: 0 0 auto;
        }

        .hero-sort {
            position: relative;
        }

        .hero-sort-trigger {
            min-height: 40px;
            min-width: 132px;
            padding: 0 12px;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: -0.01em;
        }

        .hero-sort .dropdown-menu {
            min-width: 148px;
            right: 0;
            left: auto;
            transform-origin: top right;
        }

        .meta-pill {
            min-height: 40px;
            padding: 0 14px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.72);
            -webkit-backdrop-filter: blur(12px) saturate(135%);
            backdrop-filter: blur(12px) saturate(135%);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-subtle);
        }

        .meta-pill.success {
            border-color: rgba(15, 139, 109, 0.12);
            color: var(--success);
            background: rgba(15, 139, 109, 0.12);
        }

        .drag-overlay {
            position: fixed;
            inset: 0;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(246, 243, 238, 0.72);
            backdrop-filter: blur(10px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s ease;
            z-index: 50;
        }

        .drag-overlay.visible {
            opacity: 1;
            pointer-events: none;
        }

        .drag-overlay.is-build {
            background: rgba(246, 243, 238, 0.2);
            backdrop-filter: blur(4px);
        }

        .drag-overlay-card {
            position: fixed;
            left: 8px;
            top: 8px;
            width: calc(100vw - 16px);
            height: calc(100vh - 16px);
            border-radius: 32px;
            border: 2px dashed rgba(31, 111, 255, 0.42);
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 0.84)),
                linear-gradient(135deg, rgba(31, 111, 255, 0.1), rgba(15, 139, 109, 0.06));
            box-shadow: 0 24px 48px rgba(31, 111, 255, 0.12);
            padding: 28px 32px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 14px;
            text-align: center;
            overflow: hidden;
            transition:
                left 0.56s cubic-bezier(0.22, 1, 0.36, 1),
                top 0.56s cubic-bezier(0.22, 1, 0.36, 1),
                width 0.56s cubic-bezier(0.22, 1, 0.36, 1),
                height 0.56s cubic-bezier(0.22, 1, 0.36, 1),
                border-radius 0.56s cubic-bezier(0.22, 1, 0.36, 1),
                padding 0.56s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.56s cubic-bezier(0.22, 1, 0.36, 1),
                background 0.3s ease,
                border-color 0.3s ease,
                opacity 0.18s ease;
        }

        .drag-overlay-card.is-build {
            left: var(--build-left, 24px);
            top: var(--build-top, 24px);
            width: var(--build-width, 180px);
            height: var(--build-height, 210px);
            border-radius: 24px;
            border-style: solid;
            border-color: rgba(31, 111, 255, 0.18);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(255, 255, 255, 0.9)),
                linear-gradient(135deg, rgba(31, 111, 255, 0.08), rgba(15, 139, 109, 0.04));
            box-shadow: 0 18px 34px rgba(48, 41, 29, 0.12);
            padding: 18px;
            justify-content: flex-start;
            gap: 10px;
            text-align: left;
        }

        .drag-overlay-card.is-success {
            border-color: rgba(15, 139, 109, 0.2);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(247, 255, 252, 0.92)),
                linear-gradient(135deg, rgba(15, 139, 109, 0.08), rgba(31, 111, 255, 0.04));
        }

        .drag-overlay.is-build .drag-overlay-card {
            opacity: 0;
            transform: scale(0.98);
        }

        .drag-overlay-kicker {
            font-family: var(--font-mono);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0;
            color: var(--accent);
        }

        .drag-overlay-card.is-build .drag-overlay-kicker {
            font-size: 10px;
            letter-spacing: 0;
        }

        .drag-overlay-card.is-success .drag-overlay-kicker {
            color: var(--success);
        }

        .drag-overlay-title {
            font-size: clamp(28px, 4vw, 44px);
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.08;
            word-break: keep-all;
        }

        .drag-overlay-card.is-build .drag-overlay-title {
            font-size: 18px;
            line-height: 1.18;
            letter-spacing: -0.02em;
            max-width: 10ch;
        }

        .drag-overlay-desc {
            margin: 0 auto;
            max-width: 42ch;
            color: var(--text-subtle);
            line-height: 1.7;
            letter-spacing: -0.01em;
            font-size: 15px;
            word-break: keep-all;
        }

        .drag-overlay-card.is-build .drag-overlay-desc {
            margin: 0;
            max-width: none;
            font-size: 12px;
            line-height: 1.5;
            letter-spacing: -0.01em;
        }

        .drag-overlay-progress {
            width: 100%;
            height: 7px;
            border-radius: 999px;
            background: rgba(30, 31, 36, 0.08);
            overflow: hidden;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            margin-top: auto;
        }

        .drag-overlay-card.is-build .drag-overlay-progress {
            opacity: 1;
            transform: translateY(0);
        }

        .drag-overlay-progress-bar {
            width: 42%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, rgba(31, 111, 255, 0.18), rgba(31, 111, 255, 0.72), rgba(15, 139, 109, 0.5));
            animation: drag-overlay-progress 1.1s ease-in-out infinite;
        }

        .drag-overlay-card.is-success .drag-overlay-progress-bar {
            animation: none;
            width: 100%;
            background: linear-gradient(90deg, rgba(15, 139, 109, 0.45), rgba(15, 139, 109, 0.9));
        }

        @keyframes drag-overlay-progress {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(240%);
            }
        }

        .drag-overlay-build-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .drag-overlay-build-card {
            position: fixed;
            left: 8px;
            top: 8px;
            width: calc(100vw - 16px);
            height: calc(100vh - 16px);
            border-radius: 32px;
            border: 2px solid rgba(31, 111, 255, 0.18);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(255, 255, 255, 0.9)),
                linear-gradient(135deg, rgba(31, 111, 255, 0.08), rgba(15, 139, 109, 0.04));
            box-shadow: 0 18px 34px rgba(48, 41, 29, 0.12);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: flex-start;
            overflow: hidden;
            opacity: 0;
            transition:
                left 0.56s cubic-bezier(0.22, 1, 0.36, 1),
                top 0.56s cubic-bezier(0.22, 1, 0.36, 1),
                width 0.56s cubic-bezier(0.22, 1, 0.36, 1),
                height 0.56s cubic-bezier(0.22, 1, 0.36, 1),
                border-radius 0.56s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.18s ease,
                transform 0.56s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.3s ease,
                border-color 0.3s ease,
                background 0.3s ease;
            transition-delay: var(--card-delay, 0ms);
            transform: scale(1);
        }

        .drag-overlay.is-build .drag-overlay-build-card {
            left: var(--card-left, 24px);
            top: var(--card-top, 24px);
            width: var(--card-width, 180px);
            height: var(--card-height, 210px);
            border-radius: 24px;
            opacity: 1;
        }

        .drag-overlay.is-success .drag-overlay-build-card {
            border-color: rgba(15, 139, 109, 0.2);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(247, 255, 252, 0.92)),
                linear-gradient(135deg, rgba(15, 139, 109, 0.08), rgba(31, 111, 255, 0.04));
        }

        .drag-overlay-build-kicker {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0;
            color: var(--accent);
        }

        .drag-overlay.is-success .drag-overlay-build-kicker {
            color: var(--success);
        }

        .drag-overlay-build-name {
            font-size: 18px;
            font-weight: 800;
            line-height: 1.18;
            letter-spacing: -0.02em;
            color: var(--text);
            word-break: keep-all;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .drag-overlay-build-desc {
            margin: 0;
            font-size: 12px;
            line-height: 1.5;
            letter-spacing: -0.01em;

        button:focus-visible:not(.dropdown-trigger),

            }

            }

</head>

        function decodeCssGlyphCharacter(rawValue = '') {
            const match = rawValue.match(/\\([0-9a-f]{1,6})/i);
            if (!match) {
                return '';
            }

            const codePoint = Number.parseInt(match[1], 16);
            if (!Number.isFinite(codePoint)) {
                return '';
            }

            try {
                return String.fromCodePoint(codePoint);
            } catch (error) {
                return '';
            }
        }

        function syncGlyphCharacterMap(cssContent = '') {
            glyphCharacterMap.clear();

            const glyphRulePattern = /\.icon--([a-z0-9_-]+)::before\s*\{\s*content:\s*"((?:\\.|[^"])*)"/g;
            for (const match of cssContent.matchAll(glyphRulePattern)) {
                const glyphName = match[1];
                const glyphCharacter = decodeCssGlyphCharacter(match[2] || '');
                if (glyphCharacter) {
                    glyphCharacterMap.set(glyphName, glyphCharacter);
                }
            }
        }

        function getGlyphCharacter(glyphKey = '') {
            return glyphCharacterMap.get(glyphKey) || '';
        }

        function getSourceIconUrl(icon) {
            const sourceStem = (icon?.key || '').replace(/_(line|fill)$/u, '');
            return icon.kind === 'fill' ? `/fill-icons/${sourceStem}.svg` : `/line-icons/${sourceStem}.svg`;
        }

        function getSourceIconFileName(icon, extension = 'svg') {
            const sourceStem = (icon?.key || '').replace(/_(line|fill)$/u, '');
            return `${sourceStem || 'icon'}.${extension}`;
        }

        function getSelectedIcon() {
            if (!state.selectedIconKey) {
                return null;
            }
            return state.icons.find((icon) => icon.key === state.selectedIconKey) || null;
        }

        async function fetchSourceIconSvg(icon) {
            const response = await fetch(getSourceIconUrl(icon), { cache: 'no-store' });
            if (!response.ok) {
                throw new Error('원본 SVG를 불러오지 못했습니다.');
            }
            return response.text();
        }

        async function copySvgSource(icon) {
            const svgSource = await fetchSourceIconSvg(icon);
            await navigator.clipboard.writeText(svgSource);
        }

        function downloadBlob(blob, fileName) {
            const objectUrl = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = objectUrl;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(objectUrl), 0);
        }

        async function downloadSvgSource(icon) {
            const svgSource = await fetchSourceIconSvg(icon);
            const blob = new Blob([svgSource], { type: 'image/svg+xml;charset=utf-8' });
            downloadBlob(blob, getSourceIconFileName(icon, 'svg'));
        }

        async function renderGlyphPngBlob(icon) {
            const glyphCharacter = getGlyphCharacter(icon.key);
            if (!glyphCharacter) {
                throw new Error('PNG로 내보낼 글리프를 찾지 못했습니다.');
            }

            const canvasSize = Math.max(state.previewSize, 24);
            const padding = Math.max(12, Math.round(canvasSize * 0.5));
            const surfaceSize = canvasSize + padding * 2;
            const scale = Math.max(2, Math.ceil(window.devicePixelRatio || 1));
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            if (!ctx) {
                throw new Error('PNG 렌더링을 시작하지 못했습니다.');
            }

            canvas.width = surfaceSize * scale;
            canvas.height = surfaceSize * scale;
            ctx.scale(scale, scale);
            ctx.clearRect(0, 0, surfaceSize, surfaceSize);
            await document.fonts.load(`${state.previewWeight} ${canvasSize}px 'MyIconFont'`);
            await document.fonts.ready;
            ctx.font = `${state.previewWeight} ${canvasSize}px 'MyIconFont'`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = state.previewColor;
            ctx.fillText(glyphCharacter, surfaceSize / 2, surfaceSize / 2 + canvasSize * 0.04);

            const blob = await new Promise((resolve, reject) => {
                canvas.toBlob((value) => {
                    if (value) {
                        resolve(value);
                        return;
                    }
                    reject(new Error('PNG 데이터 생성에 실패했습니다.'));
                }, 'image/png');
            });

            return blob;
        }

        async function copyPng(icon) {
            if (typeof ClipboardItem === 'undefined' || !navigator.clipboard?.write) {
                throw new Error('이 브라우저에서는 PNG 복사를 지원하지 않습니다.');
            }

            const blob = await renderGlyphPngBlob(icon);
            await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        }

        async function downloadPng(icon) {
            const blob = await renderGlyphPngBlob(icon);
            downloadBlob(blob, getSourceIconFileName(icon, 'png'));
        }

        function renderTokenList(container, values = []) {
            if (!container) {
                return;
            }
            if (!Array.isArray(values) || values.length === 0) {
                container.innerHTML = '<span class="icon-detail-token">등록되지 않음</span>';
                return;
            }
            container.innerHTML = values.map((value) => `<span class="icon-detail-token">${escapeHtml(value)}</span>`).join('');
        }

        function renderEditableTokenList(container, values = [], field) {
            if (!container) {
                return;
            }
            if (!Array.isArray(values) || values.length === 0) {
                container.innerHTML = '<span class="icon-detail-token">등록되지 않음</span>';
                return;
            }
            container.innerHTML = values.map((value, index) => `
                <span class="icon-detail-token">
                    <span>${escapeHtml(value)}</span>
                    <button type="button" class="icon-detail-token-remove" data-detail-token-field="${escapeHtml(field)}" data-detail-token-index="${index}" aria-label="${escapeHtml(value)} 제거">×</button>
                </span>
            `).join('');
        }

        function createDetailDraft(icon) {
            return {
                displayName: icon.displayName || '',
                category: icon.category || 'misc',
                keywords: Array.isArray(icon.keywords) ? [...icon.keywords] : [],
                synonyms: Array.isArray(icon.synonyms) ? [...icon.synonyms] : []
            };
        }

        function getDetailDraftSource(icon) {
            return state.detailEditing && state.detailDraft ? state.detailDraft : icon;
        }

        function updateDetailDirtyState(icon) {
            if (!icon || !state.detailDraft) {
                state.detailDirty = false;
                return;
            }

            const normalizedOriginal = JSON.stringify(createDetailDraft(icon));
            const normalizedDraft = JSON.stringify(state.detailDraft);
            state.detailDirty = normalizedOriginal !== normalizedDraft;
        }

        function setDetailDraftField(field, value) {
            if (!state.detailDraft) {
                return;
            }
            state.detailDraft[field] = value;
            updateDetailDirtyState(getSelectedIcon());
            syncDetailEditingState(getSelectedIcon());
        }

        function normalizeDetailToken(rawValue = '') {
            return rawValue.trim().replace(/\s+/g, ' ');
        }

        function addDetailToken(field, rawValue) {
            if (!state.detailDraft || !Array.isArray(state.detailDraft[field])) {
                return false;
            }
            const normalized = normalizeDetailToken(rawValue);
            if (!normalized || state.detailDraft[field].includes(normalized)) {
                return false;
            }
            state.detailDraft[field] = [...state.detailDraft[field], normalized];
            updateDetailDirtyState(getSelectedIcon());
            syncDetailEditingState(getSelectedIcon());
            return true;
        }

        function removeDetailToken(field, index) {
            if (!state.detailDraft || !Array.isArray(state.detailDraft[field])) {
                return;
            }
            state.detailDraft[field] = state.detailDraft[field].filter((_, tokenIndex) => tokenIndex !== index);
            updateDetailDirtyState(getSelectedIcon());
            syncDetailEditingState(getSelectedIcon());
        }

        function syncDetailEditingState(icon) {
            const draft = icon ? getDetailDraftSource(icon) : null;
            iconDetailSheet.classList.toggle('editing-detail-metadata', state.detailEditing);
            iconDetailEditButton.hidden = state.detailEditing;
            iconDetailSaveButton.hidden = !state.detailEditing;
            iconDetailCancelButton.hidden = !state.detailEditing;
            iconDetailUnsavedBadge.hidden = !state.detailEditing || !state.detailDirty;
            iconDetailSaveButton.disabled = !state.detailDirty;

            if (!draft) {
                return;
            }

            iconDetailDisplayNameInput.value = draft.displayName || '';
            iconDetailMetadataCategory.textContent = getCategoryLabel(draft.category || 'misc');
            iconDetailCategoryInput.innerHTML = [
                ...CATEGORY_CONFIG.map((category) => `<option value="${escapeHtml(category.key)}">${escapeHtml(category.label)}</option>`),
                '<option value="misc">기타</option>'
            ].join('');
            iconDetailCategoryInput.value = draft.category || 'misc';

            if (state.detailEditing) {
                renderEditableTokenList(iconDetailKeywords, draft.keywords, 'keywords');
                renderEditableTokenList(iconDetailSynonyms, draft.synonyms, 'synonyms');
            } else {
                renderTokenList(iconDetailKeywords, draft.keywords);
                renderTokenList(iconDetailSynonyms, draft.synonyms);
            }
        }

        function buildDetailSearchText(draft) {
            return [
                draft.displayName || '',
                ...(Array.isArray(draft.keywords) ? draft.keywords : []),
                ...(Array.isArray(draft.synonyms) ? draft.synonyms : []),
                getCategoryLabel(draft.category || 'misc')
            ]
                .join(' ')
                .toLowerCase();
        }

        function applyDetailDraftToIcon(icon, draft) {
            if (!icon || !draft) {
                return;
            }

            icon.displayName = draft.displayName;
            icon.category = draft.category;
            icon.keywords = [...draft.keywords];
            icon.synonyms = [...draft.synonyms];
            icon.searchText = buildDetailSearchText(draft);
        }

        function commitDetailDraft(savedDraft = state.detailDraft) {
            const icon = getSelectedIcon();
            if (!icon || !savedDraft) {
                return;
            }

            applyDetailDraftToIcon(icon, savedDraft);
            state.detailEditing = false;
            state.detailDirty = false;
            state.detailDraft = null;
        }

        async function persistDetailDraft() {
            const icon = getSelectedIcon();
            if (!icon || !state.detailDraft) {
                return;
            }

            const response = await fetch(`/api/icon-metadata/${encodeURIComponent(icon.key)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    displayName: state.detailDraft.displayName,
                    category: state.detailDraft.category,
                    keywords: state.detailDraft.keywords,
                    synonyms: state.detailDraft.synonyms
                })
            });

            const payload = await response.json();
            if (!response.ok) {
                throw new Error(payload.error || '메타데이터를 저장하지 못했습니다.');
            }

            return payload.icon;
        }

        function renderIconDetailSheet() {
            const icon = getSelectedIcon();
            if (!icon) {
                iconDetailSheet.hidden = true;
                iconDetailSheetBackdrop.hidden = true;
                iconDetailSheet.classList.remove('is-open', 'editing-detail-metadata');
                iconDetailSheetBackdrop.classList.remove('is-open');
                document.body.style.overflow = '';
                return;
            }

            const metadataSource = getDetailDraftSource(icon);
            const glyphCharacter = getGlyphCharacter(icon.key);
            const previewMarkup = detailPreviewSizes.map((size) => `
                <div class="icon-detail-size-card">
                    <i class="icon ${icon.className} icon-detail-size-icon" aria-hidden="true" style="font-size:${size}px;"></i>
                    <span class="icon-detail-size-label">${size}px</span>
                </div>
            `).join('');

            iconDetailTitle.textContent = icon.displayName;
            iconDetailSubtitle.textContent = `${getCategoryLabel(icon.category)} · ${getKindLabel(icon.kind)}`;
            iconDetailSourceImage.src = getSourceIconUrl(icon);
            iconDetailSourceImage.alt = `${icon.displayName} 원본 SVG`;
            iconDetailSourceStage.classList.toggle('keyline-visible', state.detailKeylineVisible);
            iconDetailKeylineToggle.setAttribute('aria-pressed', String(state.detailKeylineVisible));
            iconDetailGlyphKey.textContent = icon.key;
            iconDetailClassKey.textContent = icon.className;
            iconDetailCategory.textContent = getCategoryLabel(icon.category);
            iconDetailKind.textContent = getKindLabel(icon.kind);
            iconDetailDisplayName.textContent = metadataSource.displayName;
            iconDetailMetadataCategory.textContent = getCategoryLabel(metadataSource.category || 'misc');
            syncDetailEditingState(icon);
            iconDetailSizePreviews.innerHTML = previewMarkup;

        function classifyGlyph(glyphKey) {
            const normalized = glyphKey.replace(/_(fill|line)$/u, '');
            for (const category of CATEGORY_CONFIG) {
                if (category.keywords.some((keyword) => normalized.includes(keyword))) {
                    return category.key;
                }
            }
            return 'misc';
        }

        function getCategoryLabel(categoryKey) {
            if (categoryKey === 'all') return '전체';
            if (categoryKey === 'misc') return '기타';
            const match = CATEGORY_CONFIG.find((item) => item.key === categoryKey);
            return match ? match.label : categoryKey;
        }

        function getVisibleIcons() {
            const rawQuery = state.query.trim();
            const query = rawQuery.toLowerCase();
            return state.icons.filter((icon) => {
                const matchesCategory = state.category === 'all' || icon.category === state.category;
                const matchesKind = state.kind === 'all' || icon.kind === state.kind;
                const categoryLabel = getCategoryLabel(icon.category).toLowerCase();
                const glyphCharacter = getGlyphCharacter(icon.key);
                const matchesGlyph = rawQuery !== '' && glyphCharacter && glyphCharacter.includes(rawQuery);
                const matchesQuery = rawQuery === '' || (icon.searchText || '').includes(query) || icon.displayName.toLowerCase().includes(query) || categoryLabel.includes(query) || matchesGlyph;
                return matchesCategory && matchesKind && matchesQuery;
            });
        }

        function sortVisibleIcons(icons) {
            return [...icons].sort((left, right) => {
                if (state.sortMode === 'name') {
                    return left.displayName.localeCompare(right.displayName);
                }

                if (state.sortMode === 'category') {
                    const categoryComparison = (left.category || '').localeCompare(right.category || '');
                    if (categoryComparison !== 0) {
                        return categoryComparison;
                    }
                    return left.displayName.localeCompare(right.displayName);
                }

                return left.displayName.localeCompare(right.displayName);
            });
        }

        function getCategoryOptions() {
            const counts = state.icons.reduce((map, icon) => {
                map[icon.category] = (map[icon.category] || 0) + 1;
                return map;
            }, {});

            const options = [{ key: 'all', count: state.icons.length }];
            CATEGORY_CONFIG.forEach((category) => {
                if (counts[category.key]) {
                    options.push({ key: category.key, count: counts[category.key] });
                }
            });
            if (counts.misc) {
                options.push({ key: 'misc', count: counts.misc });
            }

            return options;
        }

        async function runDetailAction(actionKind) {
            const icon = getSelectedIcon();
            if (!icon) {
                return;
            }

            if (actionKind === 'copy-glyph') {
                const glyphCharacter = getGlyphCharacter(icon.key);
                if (!glyphCharacter) {
                    throw new Error('글리프를 찾지 못했습니다.');
                }
                await navigator.clipboard.writeText(glyphCharacter);
                showToast('글리프를 복사했습니다.');
                return;
            }

            if (actionKind === 'copy-class') {
                await navigator.clipboard.writeText(icon.className);
                showToast(`클래스 키를 복사했습니다: ${icon.className}`);
                return;
            }

            if (actionKind === 'copy-svg') {
                await copySvgSource(icon);
                showToast('SVG를 복사했습니다.');
                return;
            }

            if (actionKind === 'copy-png') {
                await copyPng(icon);
                showToast('PNG를 복사했습니다.');
                return;
            }

            if (actionKind === 'download-svg') {
                await downloadSvgSource(icon);

                return;

            if (actionKind === 'download-png') {

            }
        }

        function createDropdownComponent({
            root,
            trigger,
            triggerLabel,
            triggerIcon,
            menu,
            optionClassName,
            getOptions,
            getActiveOption,
            getOptionValue,
            formatTriggerLabel,
            formatOptionLabel,
            renderOptionContent,
            onPopulateTrigger,
            onSelect
        }) {
            const closedIconClass = triggerIcon.className;
            const openIconClass = closedIconClass.replace('chevron_down_line', 'chevron_up_line');

            function close() {
                root.classList.remove('open');
                trigger.setAttribute('aria-expanded', 'false');
                triggerIcon.className = closedIconClass;
            }

            function open() {
                closeAllDropdowns(component);
                root.classList.add('open');
                trigger.setAttribute('aria-expanded', 'true');
                triggerIcon.className = openIconClass;
            }

            function toggle() {
                if (root.classList.contains('open')) {
                    close();
                } else {
                    open();
                }
            }

            function populate() {
                const options = getOptions();
                const activeOption = getActiveOption(options) || options[0];
                if (!activeOption) {
                    menu.innerHTML = '';
                    return;
                }

                triggerLabel.textContent = formatTriggerLabel(activeOption, options);
                onPopulateTrigger?.(activeOption, options);
                menu.innerHTML = options.map((optionData) => {
                    const value = String(getOptionValue(optionData));
                    const selected = getOptionValue(activeOption) === getOptionValue(optionData);
                    const optionContent = renderOptionContent
                        ? renderOptionContent(optionData, selected)
                        : `<span>${formatOptionLabel(optionData)}</span>`;
                    const optionCheck = selected ? '<i class="icon icon--approve_line dropdown-option-check" aria-hidden="true"></i>' : '';
                    return `
                        <button
                            type="button"
                            class="dropdown-option ${optionClassName}${selected ? ' active' : ''}"
                            data-dropdown-value="${escapeHtml(value)}"
                            role="option"
                            aria-selected="${selected ? 'true' : 'false'}"
                        >
                            ${optionContent}
                            ${optionCheck}
                        </button>
                    `;
                }).join('');
            }

            trigger.addEventListener('click', () => {
                toggle();
            });

            trigger.addEventListener('keydown', (event) => {
                if (event.key === 'ArrowDown' || event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    open();
                    menu.querySelector('.dropdown-option.active, .dropdown-option')?.focus();
                }
            });

            menu.addEventListener('click', (event) => {
                const option = event.target.closest('.dropdown-option');
                if (!option) return;
                onSelect(option.dataset.dropdownValue || '');
                populate();
                close();
                trigger.focus();
            });

            const component = { root, trigger, menu, close, open, toggle, populate };
            dropdownComponents.push(component);
            return component;
        }

        function getBuildOverlayTargetRects(count) {
            const firstCard = libraryGrid.querySelector('.icon-card');
            const gridRect = libraryGrid.getBoundingClientRect();
            const gridStyle = window.getComputedStyle(libraryGrid);
            const columnGap = Number.parseFloat(gridStyle.columnGap || gridStyle.gap) || 16;
            const rowGap = Number.parseFloat(gridStyle.rowGap || gridStyle.gap) || 16;
            const templateColumns = gridStyle.gridTemplateColumns.split(' ').filter(Boolean);
            const columnCount = Math.max(1, templateColumns.length || 1);

            let width;
            let height;
            if (firstCard) {
                const sampleRect = firstCard.getBoundingClientRect();
                width = sampleRect.width;
                height = sampleRect.height;
            } else {
                width = Math.max(170, (gridRect.width - columnGap * (columnCount - 1)) / columnCount);
                height = 210;
            }

            return Array.from({ length: count }, (_, index) => {
                const row = Math.floor(index / columnCount);
                const col = index % columnCount;
                return {
                    left: gridRect.left + col * (width + columnGap),
                    top: gridRect.top + row * (height + rowGap),
                    width,
                    height
                };
            });
        }

            `;
        }

        function renderListCard(icon) {
            const glyphCharacter = getGlyphCharacter(icon.key);
            const isDetailActive = state.selectedIconKey === icon.key;
            const supplementalTerms = (Array.isArray(icon.synonyms) && icon.synonyms.length > 0 ? icon.synonyms : icon.keywords || []).slice(0, 3);
            return `
                <article class="icon-card list-card${isDetailActive ? ' detail-active' : ''}" data-card-type="list" data-glyph-key="${escapeHtml(icon.key)}" data-category="${escapeHtml(icon.category)}" data-kind="${escapeHtml(icon.kind)}">
                    <div class="list-card-preview">
                        <i class="icon ${icon.className} library-icon" aria-hidden="true"></i>
                    </div>
                    <div class="list-card-main">
                        <div class="card-title">${icon.displayName}</div>
                        ${supplementalTerms.length > 0 ? `<div class="list-card-search-terms">${escapeHtml(supplementalTerms.join(' · '))}</div>` : ''}
                        <div class="list-card-meta">
                            <span class="list-card-meta-chip">${getCategoryLabel(icon.category)}</span>
                            <span class="list-card-meta-chip">${icon.kind}</span>
                        </div>
                    </div>
                    <div class="list-card-actions" aria-label="${icon.displayName} 액션">
                        <div class="list-action-group copy-action-group">
                            <button type="button" class="list-action-main glyph-copy-button" data-menu-group="copy" aria-haspopup="menu" aria-expanded="false" aria-label="복사 메뉴 열기">
                                <i class="icon icon--copy_line list-copy-button-icon" aria-hidden="true"></i>
                                <span>복사하기</span>
                                <i class="icon icon--chevron_down_line list-action-main-chevron" aria-hidden="true"></i>
                            </button>
                            <div class="list-action-menu" role="menu" aria-label="복사 액션 메뉴">
                                <button type="button" class="list-action-item" data-action-kind="copy-glyph" data-copy-kind="glyph" data-copy-value="${escapeHtml(glyphCharacter)}" role="menuitem">
                                    <i class="icon icon--copy_line list-action-item-icon" aria-hidden="true"></i>
                                    <span>글리프 복사</span>
                                </button>
                                <button type="button" class="list-action-item" data-action-kind="copy-class" data-copy-kind="class" data-copy-value="${escapeHtml(icon.className)}" role="menuitem">
                                    <i class="icon icon--copy_line list-action-item-icon" aria-hidden="true"></i>
                                    <span>클래스 복사</span>
                                </button>
                                <button type="button" class="list-action-item" data-action-kind="copy-name" data-copy-kind="name" data-copy-value="${escapeHtml(icon.displayName)}" role="menuitem">
                                    <i class="icon icon--copy_line list-action-item-icon" aria-hidden="true"></i>
                                    <span>아이콘 이름 복사</span>
                                </button>
                                <button type="button" class="list-action-item" data-action-kind="copy-svg" role="menuitem">
                                    <i class="icon icon--copy_line list-action-item-icon" aria-hidden="true"></i>
                                    <span>SVG 복사</span>
                                </button>
                                <button type="button" class="list-action-item" data-action-kind="copy-png" role="menuitem">
                                    <i class="icon icon--copy_line list-action-item-icon" aria-hidden="true"></i>
                                    <span>PNG 복사</span>
                                </button>
                            </div>
                        </div>
                        <div class="list-action-group download-action-group">
                            <button type="button" class="list-action-main svg-download-button" data-menu-group="download" aria-haspopup="menu" aria-expanded="false" aria-label="다운로드 메뉴 열기">
                                <i class="icon icon--download_line list-copy-button-icon" aria-hidden="true"></i>
                                <span>내려받기</span>
                                <i class="icon icon--chevron_down_line list-action-main-chevron" aria-hidden="true"></i>
                            </button>
                            <div class="list-action-menu" role="menu" aria-label="다운로드 액션 메뉴">
                                <button type="button" class="list-action-item" data-action-kind="download-svg" role="menuitem">
                                    <i class="icon icon--download_line list-action-item-icon" aria-hidden="true"></i>
                                    <span>SVG 다운로드</span>
                                </button>
                                <button type="button" class="list-action-item" data-action-kind="download-png" role="menuitem">
                                    <i class="icon icon--download_line list-action-item-icon" aria-hidden="true"></i>
                                    <span>PNG 다운로드</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </article>
            `;
        }

        function renderGrid() {
            const visibleIcons = sortVisibleIcons(getVisibleIcons());
            libraryGrid.classList.toggle('list-view', state.viewMode === 'list');
            const pendingCards = state.pendingBuilds.map((build, index) => `
                <article class="pending-build-card">
                    <div class="pending-build-kicker">${state.pendingBuilds.length > 1 ? `${index + 1}/${state.pendingBuilds.length}` : '변환 중'}</div>
                    <div class="pending-build-title">웹폰트로 변환 중</div>
                    <div class="pending-build-name">${escapeHtml(build.label)}</div>
                    <p class="pending-build-desc">SVG를 정리하고 폰트를 빌드하고 있습니다</p>
                    <div class="pending-build-progress" aria-hidden="true">
                        <div class="pending-build-progress-bar"></div>
                    </div>
                </article>
            `).join('');

            if (state.loadError) {
                libraryGrid.innerHTML = `
                    <article class="empty-card error-state">
                        <div>
                            <strong>빌드된 라이브러리를 불러오지 못했습니다.</strong>
                            <p>서버 상태를 확인한 뒤 다시 새로고침하거나, 업로드 후 자동 빌드를 다시 시도해보세요.</p>
                        </div>
                    </article>
                `;
                return;
            }

            if (visibleIcons.length === 0 && state.pendingBuilds.length === 0) {
                const emptyStateFilters = getEmptyStateFilters();
                libraryGrid.innerHTML = `
                    <article class="empty-card">
                        <div class="empty-card-content">
                            <strong>${state.icons.length === 0 ? '아직 빌드된 웹폰트 아이콘이 없습니다.' : '조건에 맞는 웹폰트 아이콘이 없습니다.'}</strong>
                            <p>${state.icons.length === 0 ? 'SVG를 업로드하면 자동 빌드 후 라이브러리에 바로 반영됩니다.' : '검색어를 바꾸거나 카테고리를 다시 선택해보세요.'}</p>
                            ${state.icons.length === 0 || emptyStateFilters.length === 0 ? '' : `<div class="empty-card-filters">현재 조건: ${escapeHtml(emptyStateFilters.join(' · '))}</div>`}
                        </div>
                    </article>
                `;
                return;
            }

            let cardMarkup = '';
            if (state.viewMode === 'grid') {
                cardMarkup = visibleIcons.map(renderGridCard).join('');
            } else {
                cardMarkup = visibleIcons.map(renderListCard).join('');
            }

            libraryGrid.innerHTML = `${pendingCards}${cardMarkup}`;
            renderIconDetailSheet();
        }

        function showToast(message, isError = false) {
            statusToast.textContent = message;
            statusToast.classList.toggle('error', isError);
            statusToast.classList.add('visible');
            clearTimeout(showToast.timer);
            showToast.timer = setTimeout(() => {
                statusToast.classList.remove('visible');
                statusToast.classList.remove('error');
            }, 2600);
        }

        async function refreshGeneratedFontStyles(options = {}) {
            const required = options.required === true;
            const version = options.version || Date.now();
            const response = await fetch(`/generated-fonts/my-icon-font.css?v=${version}`, { cache: 'no-store' });

            if (!response.ok) {
                if (!required && response.status === 404) {
                    generatedFontStyle.textContent = '';
                    glyphCharacterMap.clear();
                    return false;
                }

                throw new Error('빌드된 웹폰트 스타일을 불러오지 못했습니다.');
            }

            const css = await response.text();
            generatedFontStyle.textContent = css.replace(
                /url\((['"]?)(?:\.\/)?(MyIconFont-[^)'"?]+\.woff2)\1\)/g,
                `url('/generated-fonts/$2?v=${version}')`
            );
            syncGlyphCharacterMap(css);
            return true;
        }

        async function loadLibrary() {
            const response = await fetch('/api/library-icons');
            if (!response.ok) {
                throw new Error('빌드된 라이브러리를 불러오지 못했습니다.');
            }

            const payload = await response.json();
            state.icons = (payload.icons || []).map((icon) => ({
                ...icon,
                category: icon.category || classifyGlyph(icon.key)
            }));
            state.loadError = false;

            categoryDropdownComponent.populate();
            kindDropdownComponent.populate();
            renderGrid();
            if (payload.lastBuiltAt) {
                lastBuiltAt.textContent = `Last build ${new Date(payload.lastBuiltAt).toLocaleString()}`;
            } else {
                lastBuiltAt.textContent = '빌드 대기';
            }
        }

        async function uploadFiles(fileList) {
            if (state.isUploading) {
                return;
            }

            const svgFiles = Array.from(fileList).filter((file) => file.name.toLowerCase().endsWith('.svg'));
            if (svgFiles.length === 0) {
                showToast('SVG 파일만 업로드할 수 있습니다.', true);
                return;
            }

            state.isUploading = true;
            state.pendingBuilds = svgFiles.map((file, index) => ({
                id: `${Date.now()}-${index}`,
                label: formatPendingBuildName(file.name)
            }));
            setUploadAvailability();
            hideDragOverlay();
            renderGrid();
            showToast(`${svgFiles.length}개의 아이콘을 업로드하고 빌드합니다...`);

            try {
                const files = await Promise.all(svgFiles.map(async (file) => ({
                    name: file.name,
                    content: await file.text()
                })));

                const response = await fetch('/api/upload-icons', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ files })
                });

                const payload = await response.json();
                if (!response.ok) {
                    throw new Error(payload.error || 'upload failed');
                }

                try {
                    await refreshGeneratedFontStyles({ required: true, version: Date.now() });
                    await loadLibrary();
                } catch (error) {
                    state.pendingBuilds = [];
                    state.loadError = true;
                    renderGrid();
                    throw error;
                }

                state.pendingBuilds = [];
                renderGrid();
                showToast(`${payload.count}개의 아이콘이 라이브러리에 반영되었습니다.`);
            } catch (error) {
                state.pendingBuilds = [];
                renderGrid();
                throw error;
            } finally {
                state.isUploading = false;
                setUploadAvailability();
            }
        }

        function bindUploadTriggers() {
            uploadButton.addEventListener('click', () => {
                if (state.isUploading) return;
                uploadInput.click();
            });

            uploadInput.addEventListener('change', async (event) => {
                if (event.target.files?.length) {
                    try {
                        await uploadFiles(event.target.files);
                    } catch (error) {
                        showToast(error.message, true);
                    } finally {
                        uploadInput.value = '';
                    }
                }
            });

            window.addEventListener('dragenter', (event) => {
                if (!hasFilePayload(event)) {
                    return;
                }
                event.preventDefault();
                showDragOverlay();
            });

            window.addEventListener('dragover', (event) => {
                if (!hasFilePayload(event)) {
                    return;
                }
                event.preventDefault();
                showDragOverlay();
            });

            window.addEventListener('dragleave', (event) => {
                if (!hasFilePayload(event)) {
                    return;
                }
                event.preventDefault();
                hideDragOverlay(false);
            });

            window.addEventListener('drop', async (event) => {
                if (!hasFilePayload(event)) {
                    return;
                }
                event.preventDefault();
                if (state.isUploading) return;
                const files = event.dataTransfer?.files;
                if (!files?.length) return;
                try {
                    await uploadFiles(files);
                } catch (error) {
                    showToast(error.message, true);
                }
            });
        }

        function initController() {
            syncViewToggleState();
            syncLibraryHeroChrome();
            weightDropdownComponent.populate();
            sizeDropdownComponent.populate();
            paletteDropdownComponent.populate();
            sortDropdownComponent.populate();
            searchCombo.classList.toggle('has-value', Boolean(state.query));
            applyPreviewStyles();
        }

        contentScroll?.addEventListener('scroll', syncLibraryHeroChrome, { passive: true });

        searchInput.addEventListener('input', (event) => {
            state.query = event.target.value || '';
            searchCombo.classList.toggle('has-value', Boolean(state.query));
            renderGrid();
        });

        searchClearButton.addEventListener('click', () => {
            state.query = '';
            searchInput.value = '';
            searchCombo.classList.remove('has-value');
            searchInput.focus();
            renderGrid();
        });

        viewToggleButton.addEventListener('click', () => {
            state.viewMode = state.viewMode === 'grid' ? 'list' : 'grid';
            syncViewToggleState();
            renderGrid();
        });

        document.addEventListener('click', (event) => {
            if (!dropdownComponents.some((component) => component.root.contains(event.target))) {
                closeAllDropdowns();
            }
            if (!event.target.closest('.list-action-group')) {
                closeAllListActionMenus();
            }
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                closeIconDetail();
                closeAllDropdowns();
                closeAllListActionMenus();
            }
        });

        iconDetailSheetBackdrop.addEventListener('click', () => {
            closeIconDetail();
        });

        iconDetailCloseButton.addEventListener('click', () => {
            closeIconDetail();
        });

        iconDetailKeylineToggle.addEventListener('click', () => {
            state.detailKeylineVisible = !state.detailKeylineVisible;
            renderIconDetailSheet();
        });

        iconDetailEditButton.addEventListener('click', () => {
            const icon = getSelectedIcon();
            if (!icon) {
                return;
            }
            state.detailEditing = true;
            state.detailDirty = false;
            state.detailDraft = createDetailDraft(icon);
            syncDetailEditingState(icon);
        });

        iconDetailCancelButton.addEventListener('click', () => {
            state.detailEditing = false;
            state.detailDirty = false;
            state.detailDraft = null;
            renderIconDetailSheet();
        });

        iconDetailSaveButton.addEventListener('click', async () => {
            if (!state.detailDirty || !state.detailDraft) {
                return;
            }

            iconDetailSaveButton.disabled = true;

            try {
                const savedIcon = await persistDetailDraft();
                commitDetailDraft(savedIcon);
                renderIconDetailSheet();
                renderGrid();
                showToast('메타데이터를 업데이트했습니다.');
            } catch (error) {
                updateDetailDirtyState(getSelectedIcon());
                syncDetailEditingState(getSelectedIcon());
                showToast(error.message || '메타데이터를 저장하지 못했습니다.', true);
            }
        });

        iconDetailDisplayNameInput.addEventListener('input', (event) => {
            setDetailDraftField('displayName', event.target.value);
        });

        iconDetailCategoryInput.addEventListener('change', (event) => {
            setDetailDraftField('category', event.target.value);
        });

        iconDetailKeywordsInput.addEventListener('keydown', (event) => {
            if (event.key !== 'Enter' && event.key !== ',') {
                return;
            }
            event.preventDefault();
            if (addDetailToken('keywords', event.target.value)) {
                event.target.value = '';
            }
        });

        iconDetailSynonymsInput.addEventListener('keydown', (event) => {
            if (event.key !== 'Enter' && event.key !== ',') {
                return;
            }
            event.preventDefault();
            if (addDetailToken('synonyms', event.target.value)) {
                event.target.value = '';
            }
        });

        iconDetailSheet.addEventListener('click', async (event) => {
            const tokenRemoveButton = event.target.closest('.icon-detail-token-remove');
            if (tokenRemoveButton) {
                removeDetailToken(tokenRemoveButton.dataset.detailTokenField, Number(tokenRemoveButton.dataset.detailTokenIndex));
                return;
            }

            const detailAction = event.target.closest('[data-detail-action]');
            if (!detailAction) {
                return;
            }
            try {
                await runDetailAction(detailAction.dataset.detailAction);
            } catch (error) {
                showToast(error.message || '상세 액션을 실행하지 못했습니다.', true);
            }
        });

        libraryGrid.addEventListener('click', async (event) => {
            const listActionTrigger = event.target.closest('.list-action-main[data-menu-group]');
            if (listActionTrigger) {
                toggleListActionMenu(listActionTrigger.closest('.list-action-group'));
                return;
            }

            const detailOpenButton = event.target.closest('.card-copy-button, .list-action-main, .list-action-item');
            if (!detailOpenButton) {
                const clickableCard = event.target.closest('.icon-card');
                if (clickableCard) {
                    const cardIcon = getIconFromCardTarget(clickableCard);
                    if (cardIcon) {
                        openIconDetail(cardIcon);
                    }
                }
            }

            const copyButton = event.target.closest('.card-copy-button, .list-action-item[data-copy-kind]');
            if (!copyButton) {
                const actionButton = event.target.closest('.list-action-item');
                if (!actionButton) {
                    return;
                }

                const icon = getIconFromActionTarget(actionButton);
                if (!icon) {
                    return;
                }

                try {
                    if (actionButton.dataset.actionKind === 'copy-svg') {
                        await copySvgSource(icon);
                        showToast('SVG를 복사했습니다.');
                    } else if (actionButton.dataset.actionKind === 'copy-png') {
                        await copyPng(icon);
                        showToast('PNG를 복사했습니다.');
                    } else if (actionButton.dataset.actionKind === 'download-svg') {
                        await downloadSvgSource(icon);
                        showToast('SVG를 다운로드했습니다.');
                    } else if (actionButton.dataset.actionKind === 'download-png') {
                        await downloadPng(icon);
                        showToast('PNG를 다운로드했습니다.');
                    }
                    closeAllListActionMenus();
                } catch (error) {
                    showToast(error.message || '액션을 실행하지 못했습니다.', true);
                }
                return;
            }

            const value = copyButton.dataset.copyValue || '';
            if (!value) {
                return;
            }

            try {
                await navigator.clipboard.writeText(value);
                if (copyButton.dataset.copyKind === 'glyph') {
                    showToast('글리프를 복사했습니다.');
                } else if (copyButton.dataset.copyKind === 'name') {
                    showToast(`아이콘 이름을 복사했습니다: ${value}`);
                } else {
                    showToast(`클래스 키를 복사했습니다: ${value}`);
                }
                closeAllListActionMenus();
            } catch (error) {
                showToast('복사에 실패했습니다.', true);
            }
        });

        libraryGrid.addEventListener('mouseout', (event) => {
            const actionGroup = event.target.closest('.list-action-group.open');
            if (!actionGroup) {
                return;
            }

            const nextTarget = event.relatedTarget;
            if (nextTarget && actionGroup.contains(nextTarget)) {
                return;
            }

            suppressCardHover(actionGroup.closest('.list-card'));
            closeAllListActionMenus();
            suppressListHoverForExit();
        });

        libraryGrid.addEventListener('mouseout', (event) => {
            const card = event.target.closest('.icon-card.list-card.suppress-hover');
            if (!card) {
                return;
            }

            const nextTarget = event.relatedTarget;
            if (nextTarget && card.contains(nextTarget)) {
                return;
            }

            clearSuppressedCardHover(card);
        });

        initController();
        setUploadAvailability();
        bindUploadTriggers();
        syncControllerHeight();

        if (typeof ResizeObserver === 'function') {
            const resizeObserver = new ResizeObserver(() => syncControllerHeight());
            resizeObserver.observe(bottomController);
        } else {
            window.addEventListener('resize', syncControllerHeight);
        }

        refreshGeneratedFontStyles()
            .then(() => loadLibrary())
            .catch((error) => {
                state.loadError = true;
                showToast(error.message, true);
                renderGrid();
            });
    </script>
</body>
</html>
