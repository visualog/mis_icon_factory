name: Harness Check

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

jobs:
  harness:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run harness checks
        run: npm run harness:check:push
